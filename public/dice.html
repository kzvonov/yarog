<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Dice Slot Roller (d4 d6 d8 d10 d12 d20)</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      background: #0f1115;
      color: #eaeef7;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow: hidden;
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #ui {
      position: fixed;
      left: 16px;
      top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      z-index: 10;
    }

    button {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .12);
      background: rgba(255, 255, 255, .06);
      color: #eaeef7;
      cursor: pointer;
      user-select: none;
    }

    button.active {
      background: rgba(255, 255, 255, .14);
      border-color: rgba(255, 255, 255, .22);
    }

    #meta {
      opacity: .85;
      font-size: 14px;
      margin-left: 6px;
    }

    #slot {
      position: fixed;
      right: 16px;
      top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      font-weight: 900;
      letter-spacing: -0.5px;
      z-index: 10;
      min-width: 120px;
      text-align: center;
    }

    #slot small {
      display: block;
      opacity: .75;
      font-weight: 700;
      letter-spacing: 0;
      margin-top: 4px;
      font-size: 12px;
    }

    .hint {
      position: fixed;
      left: 16px;
      bottom: 16px;
      opacity: .7;
      font-size: 13px;
      background: rgba(255, 255, 255, .06);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 10px 12px;
      border-radius: 12px;
      z-index: 10;
    }
  </style>

  <!-- ✅ Import map: lets the browser resolve "three" like a real module -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
  <div id="ui">
    <button data-sides="4">d4</button>
    <button data-sides="6" class="active">d6</button>
    <button data-sides="8">d8</button>
    <button data-sides="10">d10</button>
    <button data-sides="12">d12</button>
    <button data-sides="20">d20</button>
    <button id="rollBtn">Roll</button>
    <div id="meta">Selected: d6</div>
  </div>

  <div id="slot">
    <div id="slotValue">—</div>
    <small id="slotLabel">d6</small>
  </div>

  <div class="hint">Space = roll • Click die buttons to switch</div>

  <canvas id="c"></canvas>

  <script type="module">
    import * as THREE from "three";

    const canvas = document.getElementById("c");
    const meta = document.getElementById("meta");
    const rollBtn = document.getElementById("rollBtn");
    const slotValue = document.getElementById("slotValue");
    const slotLabel = document.getElementById("slotLabel");

    // ---------- basics ----------
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1115);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 100);
    camera.position.set(0, 1.6, 4.2);
    camera.lookAt(0, 0.2, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(3, 6, 2);
    scene.add(key);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshStandardMaterial({ color: 0x141824, roughness: 0.92, metalness: 0.0 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -1.0;
    scene.add(floor);

    // ---------- helpers ----------
    const rand = (min, max) => min + Math.random() * (max - min);
    const randi = (min, max) => Math.floor(rand(min, max + 1));
    const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);

    // ---------- d10 geometry (pentagonal trapezohedron-ish) ----------
    function makeD10Geometry(radius = 1) {
      const top = new THREE.Vector3(0, radius * 0.95, 0);
      const bottom = new THREE.Vector3(0, -radius * 0.95, 0);

      const ring = [];
      const n = 10;
      const ringR = radius * 0.85;
      const h = radius * 0.25;

      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const y = (i % 2 === 0) ? h : -h;
        ring.push(new THREE.Vector3(Math.cos(a) * ringR, y, Math.sin(a) * ringR));
      }

      const vertices = [top, bottom, ...ring];
      const indices = [];

      for (let i = 0; i < n; i++) {
        const a = 2 + i;
        const b = 2 + ((i + 1) % n);
        indices.push(0, a, b);
      }
      for (let i = 0; i < n; i++) {
        const a = 2 + i;
        const b = 2 + ((i + 1) % n);
        indices.push(1, b, a);
      }

      const g = new THREE.BufferGeometry();
      const pos = new Float32Array(vertices.flatMap(v => [v.x, v.y, v.z]));
      g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      g.setIndex(indices);
      g.computeVertexNormals();
      return g;
    }

    function geometryForSides(sides) {
      const r = 1;
      switch (sides) {
        case 4: return new THREE.TetrahedronGeometry(r, 0);
        case 6: return new THREE.BoxGeometry(r * 1.35, r * 1.35, r * 1.35);
        case 8: return new THREE.OctahedronGeometry(r, 0);
        case 10: return makeD10Geometry(r);
        case 12: return new THREE.DodecahedronGeometry(r, 0);
        case 20: return new THREE.IcosahedronGeometry(r, 0);
        default: return new THREE.BoxGeometry(r * 1.35, r * 1.35, r * 1.35);
      }
    }

    // ---------- materials ----------
    const dieMaterial = new THREE.MeshStandardMaterial({
      color: 0xf3f4f7,
      roughness: 0.35,
      metalness: 0.05,
    });

    const edgeMaterial = new THREE.LineBasicMaterial({
      color: 0x000000,
      transparent: true,
      opacity: 0.95
    });

    // ---------- floating number label (on the die) ----------
    function makeLabelSprite(text) {
      const s = 256;
      const cnv = document.createElement("canvas");
      cnv.width = cnv.height = s;
      const ctx = cnv.getContext("2d");

      // background pill
      ctx.clearRect(0, 0, s, s);
      ctx.fillStyle = "rgba(15,17,21,0.72)";
      roundRect(ctx, 28, 70, 200, 120, 28);
      ctx.fill();

      // border
      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 4;
      roundRect(ctx, 28, 70, 200, 120, 28);
      ctx.stroke();

      // text
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 92px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(text), s / 2, s / 2 + 8);

      const tex = new THREE.CanvasTexture(cnv);
      tex.anisotropy = 8;
      const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
      const spr = new THREE.Sprite(mat);
      spr.scale.set(1.2, 1.2, 1);
      spr.position.set(0, 1.15, 0);
      spr.userData._canvas = cnv;
      spr.userData._ctx = ctx;
      spr.userData._tex = tex;
      return spr;
    }

    function roundRect(ctx, x, y, w, h, r) {
      const rr = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + rr, y);
      ctx.arcTo(x + w, y, x + w, y + h, rr);
      ctx.arcTo(x + w, y + h, x, y + h, rr);
      ctx.arcTo(x, y + h, x, y, rr);
      ctx.arcTo(x, y, x + w, y, rr);
      ctx.closePath();
    }

    function updateLabelSprite(sprite, text) {
      const ctx = sprite.userData._ctx;
      const cnv = sprite.userData._canvas;
      const tex = sprite.userData._tex;

      const s = cnv.width;
      ctx.clearRect(0, 0, s, s);

      ctx.fillStyle = "rgba(15,17,21,0.72)";
      roundRect(ctx, 28, 70, 200, 120, 28);
      ctx.fill();

      ctx.strokeStyle = "rgba(255,255,255,0.18)";
      ctx.lineWidth = 4;
      roundRect(ctx, 28, 70, 200, 120, 28);
      ctx.stroke();

      ctx.fillStyle = "#ffffff";
      ctx.font = "900 92px system-ui, -apple-system, Segoe UI, Roboto, sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(String(text), s / 2, s / 2 + 8);

      tex.needsUpdate = true;
    }

    // ---------- dice object ----------
    let currentSides = 6;

    const diceGroup = new THREE.Group();
    scene.add(diceGroup);

    let diceMesh = null;
    let edges = null;
    let labelSprite = makeLabelSprite("—");
    diceGroup.add(labelSprite);

    function rebuildDie(sides) {
      // dispose old
      if (diceMesh) {
        diceGroup.remove(diceMesh);
        diceMesh.geometry.dispose();
      }
      if (edges) {
        diceMesh?.remove(edges);
        edges.geometry.dispose();
      }

      const geom = geometryForSides(sides);
      diceMesh = new THREE.Mesh(geom, dieMaterial);
      diceMesh.position.set(0, 0.1, 0);
      diceGroup.add(diceMesh);

      edges = new THREE.LineSegments(new THREE.EdgesGeometry(geom, 12), edgeMaterial);
      diceMesh.add(edges);

      // reset to stable base pose
      diceGroup.position.set(0, 0.2, 0);
      diceGroup.rotation.set(0, 0, 0);

      // update UI
      meta.textContent = `Selected: d${sides}`;
      slotLabel.textContent = `d${sides}`;
      slotValue.textContent = "—";
      updateLabelSprite(labelSprite, "—");
    }

    rebuildDie(currentSides);

    // ---------- slot-machine roll ----------
    let rolling = false;
    let t = 0;
    let duration = 1.2;

    let startQ = new THREE.Quaternion();
    let endQ = new THREE.Quaternion();

    let result = 1;

    function roll() {
      if (rolling) return;
      rolling = true;
      t = 0;
      duration = rand(0.9, 1.7);

      result = randi(1, currentSides);
      slotValue.textContent = "…";
      updateLabelSprite(labelSprite, "…");
      meta.textContent = `Rolling d${currentSides}…`;

      // start orientation
      startQ.copy(diceGroup.quaternion);

      // We want: random crazy spin BUT end in a stable pose (no drift)
      // Base end pose is identity with a clean yaw variation so it doesn't feel identical.
      const yaw = (Math.PI / 2) * randi(0, 3);
      const baseEnd = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, yaw, 0));

      // Add extra spins (slot feel), but we will SNAP at the end anyway.
      const extra = new THREE.Quaternion().setFromEuler(
        new THREE.Euler(
          Math.PI * 2 * randi(2, 5),
          Math.PI * 2 * randi(2, 5),
          Math.PI * 2 * randi(2, 5)
        )
      );

      endQ.copy(baseEnd).multiply(extra);
    }

    // render loop
    let last = performance.now();
    function animate() {
      requestAnimationFrame(animate);
      const now = performance.now();
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;

      if (rolling) {
        t += dt;
        const p = Math.min(1, t / duration);
        const e = easeOutCubic(p);

        // ✅ correct slerp
        diceGroup.quaternion.copy(startQ).slerp(endQ, e);

        const bob = Math.sin(e * Math.PI) * 0.12;
        diceGroup.position.y = 0.2 + bob;

        if (p >= 1) {
          const yaw = (Math.PI / 2) * randi(0, 3);
          diceGroup.quaternion.setFromEuler(new THREE.Euler(0, yaw, 0));
          diceGroup.position.y = 0.2;

          rolling = false;
          slotValue.textContent = String(result);
          updateLabelSprite(labelSprite, String(result));
          meta.textContent = `Result: d${currentSides} → ${result}`;
        }
      }

      renderer.render(scene, camera);
    }
    animate();

    // ---------- UI wiring ----------
    document.querySelectorAll("button[data-sides]").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("button[data-sides]").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentSides = Number(btn.dataset.sides);
        rebuildDie(currentSides);
      });
    });

    rollBtn.addEventListener("click", roll);
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space") { e.preventDefault(); roll(); }
    });

    addEventListener("resize", () => {
      renderer.setSize(innerWidth, innerHeight);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });
  </script>
</body>

</html>
