<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лист героя — Dungeon World</title>

  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.png">

  <style>
    /* Hero-specific styles (not in ui.css) */

    .header .class-name {
      font-size: 0.95rem;
      color: var(--accent-blood-light);
      letter-spacing: 0.3em;
      margin-top: 5px;
    }

    /* Connection indicator */
    .connection-indicator {
      position: absolute;
      top: 15px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .connection-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent-green);
    }

    .connection-dot.offline {
      background: var(--accent-blood);
    }

    .connection-dot.syncing {
      background: var(--accent-gold);
      animation: pulse 1s infinite;
    }

    /* Settings panel */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .settings-field label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    .settings-field input,
    .settings-field select {
      width: 100%;
      padding: 8px 10px;
      background: var(--input-bg);
      border: 1px solid var(--border-dark);
      color: var(--text-primary);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .settings-field input:focus,
    .settings-field select:focus {
      outline: none;
      border-color: var(--accent-blood);
    }

    .panel-actions {
      margin-top: 10px;
    }

    .last-sync {
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* Stats Table */
    .stats {
      border-collapse: collapse;
    }

    .stats thead th {
      cursor: pointer;
      transition: color 0.2s;
    }

    .stats thead th:hover {
      color: var(--accent-blood-light);
    }

    /* Moves */

    .move-item {
      padding: 5px;
      background: var(--input-bg);
      border: 1px solid var(--border-dark);
      border-left: 3px solid var(--accent-blood);
      margin-bottom: 5px;
    }

    .move-header {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 6px;
    }

    .move-item input[type="text"] {
      flex: 1;
      padding: 4px 6px;
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--border-dark);
      color: var(--text-heading);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .move-item input[type="text"]:focus {
      outline: none;
      border-bottom-color: var(--accent-blood);
    }

    .move-item input[readonly],
    .move-item textarea[readonly] {
      background: transparent;
      cursor: default;
      opacity: 0.8;
    }

    /* Dice panel */
    .dice-panel {
      position: fixed;
      z-index: 100;
      display: flex;
      align-items: flex-start;
      gap: 0;
    }

    .dice-panel-toggle {
      width: 48px;
      height: 48px;
      background: var(--accent-blood);
      border: none;
      color: var(--text-heading);
      font-size: 1.4rem;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .dice-panel-content {
      background: var(--bg-card);
      border: 1px solid var(--border-dark);
      padding: 15px;
      width: 220px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .dice-main {
      margin-bottom: 12px;
    }

    .dice-main .dice-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.3rem;
      background: var(--input-bg);
      border: 2px solid var(--accent-blood);
    }

    .dice-main .dice-btn:hover {
      background: var(--accent-blood);
      color: var(--text-heading);
    }

    .dice-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .dice-btn {
      padding: 10px 6px;
      background: var(--input-bg);
      border: 1px solid var(--border-dark);
      color: var(--text-heading);
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }

    .dice-btn:hover {
      border-color: var(--accent-blood);
      background: var(--accent-blood);
      color: var(--text-heading);
    }

    .dice-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dice-result .result-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
    }

    .dice-result .result-breakdown {
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-top: 3px;
    }

    .dice-result .result-offline {
      font-size: 0.75rem;
      color: var(--accent-gold);
      margin-top: 3px;
    }

    .cooldown-bar {
      height: 3px;
      background: var(--border-dark);
      margin-top: 8px;
    }

    .cooldown-bar .fill {
      height: 100%;
      background: var(--accent-blood);
      width: 0%;
      transition: width 0.1s linear;
    }

    .dice-log {
      margin-top: 8px;
      max-height: 80px;
      overflow-y: auto;
      font-size: 0.75rem;
      background: var(--bg-dark);
      border: 1px solid var(--border-dark);
    }

    .dice-log .log-entry {
      padding: 4px 8px;
      border-bottom: 1px solid var(--border-dark);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .dice-log .log-entry:last-child {
      border-bottom: none;
    }

    .dice-log .log-time {
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .dice-log .log-result {
      color: var(--text-heading);
    }

    /* Layout Grid */
    .grid-main {
      display: grid;
      grid-template-columns: 4fr 4fr 3fr;
      gap: 10px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .dice-panel {
        right: 10px;
        top: auto;
        bottom: 20px;
        transform: none;
      }

      .dice-panel-toggle {
        display: flex;
      }

      .dice-panel-content {
        display: none;
        position: absolute;
        bottom: 54px;
        right: 0;
        width: 220px;
      }

      .dice-panel.open .dice-panel-content {
        display: block;
      }
    }

    @media (max-width: 600px) {
      .settings-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <link rel="stylesheet" href="ui.css" />
  <script src="ui.js"></script>
  <script src="modules/hero.js"></script>
  <script src="modules/dice.js"></script>
  <script src="modules/party.js"></script>
  <script src="modules/settings.js"></script>
</head>

<body>
  <header class="header">
    <div class="connection-indicator">
      <div class="connection-dot" id="connectionDot"></div>
      <span id="connectionText">Offline</span>
    </div>
    <h1 id="charName" data-sync-id="name">Безымянный</h1>
    <div class="class-name" style="text-transform: uppercase;">
      <span data-sync-id="origin"></span> | <span data-sync-id="klass"></span>
    </div>
  </header>

  <div class="container">
    <div class="grid-main">
      <div>
        <div class="panel">
          <button class="panel-toggle" data-panel-toggle-target="settingsContent">
            <span>⚙ Настройки</span>
            <span class="arrow">◀</span>
          </button>
          <div class="panel-content" id="settingsContent">
            <div class="settings-grid">
              <div class="settings-field">
                <label>Сервер</label>
                <input type="text" id="serverUrl" placeholder="http://localhost:3000">
              </div>
              <div class="settings-field">
                <label>Код героя</label>
                <input type="text" id="heroCode" placeholder="ABC123">
              </div>
            </div>
            <div class="panel-actions">
              <button class="btn" id="loadBtn">Загрузить</button>
              <button class="btn secondary" id="saveNowBtn">Сохранить</button>
            </div>
            <div class="last-sync" id="lastSync"></div>
          </div>
        </div>

        <div class="card">
          <table class="base-stats">
            <thead>
              <tr>
                <th>Уровень</th>
                <th>Опыт ✨</th>
                <th>Здоровье ❤️</th>
                <th>Броня 🛡️</th>
                <th>Урон ⚔️</th>
                <th>Монеты</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="no-padding"><input type="number" class="param" id="level" data-sync-id="level" value="1"
                    min="1" max="10"></td>
                <td class="no-padding"><input type="number" class="param" id="xp" data-sync-id="xp" value="0" min="0"
                    max="20"></td>
                <td class="no-padding"><input type="number" class="param" id="hp_current" data-sync-id="hp_current"
                    value="10" min="0" max="60"></td>
                <td class="no-padding"><input type="number" class="param" id="armor" data-sync-id="armor" value="0"
                    min="-5" max="10"></td>
                <td class="no-padding">
                  <input type="text" class="param" id="damage" data-sync-id="damage" value="d6">
                </td>
                <td class="no-padding">
                  <input type="number" class="param" id="coins" data-sync-id="coins" value="0">
                </td>
              </tr>
              <tr>
                <td>-</td>
                <td>/<span id="xpNext" data-sync-id="xp_next"></span></td>
                <td>/<span id="hpMax" data-sync-id="hp_max"></span></td>
                <td>-</td>
                <td>-</td>
                <td>-</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="card">
          <div class="stats-column">
            <table class="stats">
              <thead>
                <tr>
                  <th class="clickable" onclick="rollStat('str')" title="Нажми для броска 2d6">СИЛ</th>
                  <th class="clickable" onclick="rollStat('dex')" title="Нажми для броска 2d6">ЛОВ</th>
                  <th class="clickable" onclick="rollStat('con')" title="Нажми для броска 2d6">ТЕЛ</th>
                  <th class="clickable" onclick="rollStat('int')" title="Нажми для броска 2d6">ИНТ</th>
                  <th class="clickable" onclick="rollStat('wis')" title="Нажми для броска 2d6">МДР</th>
                  <th class="clickable" onclick="rollStat('cha')" title="Нажми для броска 2d6">ХАР</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_str" data-sync-id="stat_str" value="10" min="1"
                      max="18">
                  </td>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_dex" data-sync-id="stat_dex" value="10" min="1"
                      max="18">
                  </td>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_con" data-sync-id="stat_con" value="10" min="1"
                      max="18">
                  </td>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_int" data-sync-id="stat_int" value="10" min="1"
                      max="18">
                  </td>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_wis" data-sync-id="stat_wis" value="10" min="1"
                      max="18">
                  </td>
                  <td class="no-padding">
                    <input type="number" class="param" id="stat_cha" data-sync-id="stat_cha" value="10" min="1"
                      max="18">
                  </td>
                </tr>
                <tr>
                  <td data-sync-id="dice_mod_str" class="text-center text-big dice_modifier">0</td>
                  <td data-sync-id="dice_mod_dex" class="text-center text-big dice_modifier">0</td>
                  <td data-sync-id="dice_mod_con" class="text-center text-big dice_modifier">0</td>
                  <td data-sync-id="dice_mod_int" class="text-center text-big dice_modifier">0</td>
                  <td data-sync-id="dice_mod_wis" class="text-center text-big dice_modifier">0</td>
                  <td data-sync-id="dice_mod_cha" class="text-center text-big dice_modifier">0</td>
                </tr>
                <tr>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="str" data-debuff="-1">
                      <input type="checkbox" id="deb_str" data-sync-id="deb_str">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="dex" data-debuff="-1">
                      <input type="checkbox" id="deb_dex" data-sync-id="deb_dex">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="con" data-debuff="-1">
                      <input type="checkbox" id="deb_con" data-sync-id="deb_con">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="int" data-debuff="-1">
                      <input type="checkbox" id="deb_int" data-sync-id="deb_int">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="wis" data-debuff="-1">
                      <input type="checkbox" id="deb_wis" data-sync-id="deb_wis">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                  <td class="text-center">
                    <label class="checkbox-custom" data-debuff-stat="cha" data-debuff="-1">
                      <input type="checkbox" id="deb_cha" data-sync-id="deb_cha">
                      <span class="checkbox-box"></span>
                      <span class="small">-1</span>
                    </label>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="box">
          <div class="tabs">
            <button class="tab-button active" onclick="switchTab(event, 'tab-weapons')">Оружие</button>
            <button class="tab-button" onclick="switchTab(event, 'tab-equipment')">Снаряжение</button>
            <button class="tab-button" onclick="switchTab(event, 'tab-notes')">Заметки</button>
          </div>

          <div id="tab-weapons" class="tab-content active">
            <div class="form-group">
              <textarea id="weapons" data-sync-id="weapons" class="form-textarea" placeholder="..." rows="8"></textarea>
              <div class="char-count"><span data-field-count="weapons">0</span>/300</div>
            </div>
          </div>

          <div id="tab-equipment" class="tab-content">
            <div class="form-group">
              <textarea id="equipment" data-sync-id="equipment" class="form-textarea" placeholder="..."
                rows="8"></textarea>
              <div class="char-count"><span data-field-count="equipment">0</span>/300</div>
            </div>
          </div>

          <div id="tab-notes" class="tab-content">
            <div class="form-group">
              <textarea id="notes" data-sync-id="notes" class="form-textarea" placeholder="..." rows="8"></textarea>
              <div class="char-count"><span data-field-count="notes">0</span>/600</div>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="box" style="overflow-y: scroll;">
          <div class="tabs">
            <button class="tab-button active" onclick="switchTab(event, 'tab-moves')">Способности</button>
            <button class="tab-button" onclick="switchTab(event, 'tab-party')">Группа</button>
          </div>

          <div id="tab-moves" class="tab-content active">
            <div data-render-id="moves">
              <template>
                <div class="move-item">
                  <div class="move-header">
                    <input type="text" data-render-id="moves[].name" placeholder="Название способности" maxlength="100" readonly>
                  </div>
                  <textarea data-render-id="moves[].desc" placeholder="Описание..." class="form-textarea" maxlength="600" readonly></textarea>
                </div>
              </template>
            </div>
          </div>

          <div id="tab-party" class="tab-content">
            <table>
              <thead>
                <tr>
                  <th>имя</th>
                  <th>расса</th>
                  <th>класс</th>
                  <th>lvl</th>
                  <th>❤️</th>
                  <th>🛡️</th>
                  <th>⚔️</th>
                </tr>
              </thead>
              <tbody class="party-list" id="partyList">
              </tbody>
            </table>
            <div class="panel-actions">
              <button class="btn" id="partyRefresh">Обновить</button>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="dice-panel" id="dicePanel">
          <button class="dice-panel-toggle" id="dicePanelToggle">🎲</button>
          <div class="dice-panel-content">
            <div class="dice-main">
              <button class="dice-btn" data-dice="2d6">2d6</button>
            </div>
            <div class="dice-buttons">
              <button class="dice-btn" data-dice="d4">d4</button>
              <button class="dice-btn" data-dice="d6">d6</button>
              <button class="dice-btn" data-dice="d8">d8</button>
              <button class="dice-btn" data-dice="d10">d10</button>
              <button class="dice-btn" data-dice="d12">d12</button>
              <button class="dice-btn" data-dice="d20">d20</button>
            </div>
            <div class="dice-result" id="diceResult">
              <div class="result-value">—</div>
              <div class="result-breakdown">Выбери кубик</div>
            </div>
            <div class="cooldown-bar">
              <div class="fill" id="cooldownFill"></div>
            </div>
            <div class="dice-log" id="diceLog"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // ============================================================
    // CONFIG
    // ============================================================
    const Config = {
      STORAGE_KEY_SETTINGS: 'dw_settings',
      COOLDOWN_MS: 1500,
      DEBOUNCE_MS: 1500,
      TIMEOUT_MS: 5000,
      RETRY_DELAY_MS: 1000,
      TOAST_DURATION_MS: 3000
    };

    // ============================================================
    // STATE
    // ============================================================
    const State = {
      settings: {
        serverUrl: '',
        heroCode: ''
      },
      version: 0,
      updatedAt: null,
      isOnline: false,
      isSyncing: false,
      lastRollTime: 0,
      cooldownInterval: null,
      syncTimeout: null
    };

    // ============================================================
    // TOAST MODULE
    // ============================================================
    const Toast = {
      show(message, type = 'info') {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.textContent = message;
        container.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add('show'));

        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 300);
        }, Config.TOAST_DURATION_MS);
      },

      info(message) { this.show(message, 'info'); },
      error(message) { this.show(message, 'error'); },
      success(message) { this.show(message, 'success'); }
    };

    // ============================================================
    // CONNECTION MODULE
    // ============================================================
    const Connection = {
      setStatus(isOnline, isSyncing = false) {
        State.isOnline = isOnline;
        State.isSyncing = isSyncing;

        const dot = document.getElementById('connectionDot');
        const text = document.getElementById('connectionText');

        dot.className = 'connection-dot';

        if (isSyncing) {
          dot.classList.add('syncing');
          text.textContent = 'Синхронизация...';
        } else if (isOnline) {
          text.textContent = 'Online';
        } else {
          dot.classList.add('offline');
          text.textContent = 'Offline';
        }
      }
    };

    // ============================================================
    // STORAGE MODULE
    // ============================================================
    const Storage = {
      loadSettings() {
        const saved = localStorage.getItem(Config.STORAGE_KEY_SETTINGS);
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const server = params.get('server') || window.location.origin;

        if (saved && !code) {
          State.settings = { ...State.settings, ...JSON.parse(saved) };
        } else {
          State.settings = { serverUrl: server, heroCode: code }
        }
      },

      saveSettings() {
        localStorage.setItem(Config.STORAGE_KEY_SETTINGS, JSON.stringify(State.settings));
      }
    };

    // ============================================================
    // API MODULE
    // ============================================================
    const API = {
      async request(endpoint, body, retry = true) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);

        try {
          const response = await fetch(`${State.settings.serverUrl}${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
            signal: controller.signal
          });

          clearTimeout(timeout);
          return await response.json();
        } catch (err) {
          clearTimeout(timeout);

          if (retry && err.name !== 'AbortError') {
            await new Promise(r => setTimeout(r, Config.RETRY_DELAY_MS));
            return this.request(endpoint, body, false);
          }

          throw err;
        }
      },

      async get(endpoint, params = {}, retry = true) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), Config.TIMEOUT_MS);

        try {
          const queryString = new URLSearchParams(params).toString();
          const url = `${State.settings.serverUrl}${endpoint}${queryString ? '?' + queryString : ''}`;

          const response = await fetch(url, {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' },
            signal: controller.signal
          });

          clearTimeout(timeout);
          return await response.json();
        } catch (err) {
          clearTimeout(timeout);

          if (retry && err.name !== 'AbortError') {
            await new Promise(r => setTimeout(r, Config.RETRY_DELAY_MS));
            return this.get(endpoint, params, false);
          }

          throw err;
        }
      },

      async load() {
        if (!State.settings.serverUrl || !State.settings.heroCode) {
          Toast.error('Введите сервер и код героя');
          return false;
        }

        Connection.setStatus(false, true);

        try {
          const result = await this.request('/api/heroes/load', {
            code: State.settings.heroCode
          });

          if (result.status === 'ok') {
            State.version = result.version;
            State.updatedAt = result.updatedAt;
            Connection.setStatus(true);
            Hero.render(result.hero);
            UI.updateLastSync();
            Party.load({ State, API });
            Toast.success('Загружено с сервера');
            return true;
          } else {
            Connection.setStatus(false);
            Toast.error(result.message || 'Ошибка загрузки');
            return false;
          }
        } catch (err) {
          Connection.setStatus(false);
          Toast.error('Нет связи с сервером');
          return false;
        }
      },

      async save() {
        if (!State.settings.serverUrl || !State.settings.heroCode) return;

        Connection.setStatus(State.isOnline, true);

        try {
          const result = await this.request('/api/heroes/save', {
            code: State.settings.heroCode,
            version: State.version,
            hero: Hero.getData()
          });

          if (result.status === 'ok') {
            State.version = result.version;
            State.updatedAt = result.updatedAt;
            Connection.setStatus(true);
            Hero.render(result.hero);
            UI.updateLastSync();
          } else if (result.status === 'conflict') {
            // Server has newer data
            State.version = result.version;
            State.updatedAt = result.updatedAt;
            Connection.setStatus(true);
            Hero.render(result.hero);
            UI.updateLastSync();
            Toast.info('Данные обновлены с сервера');
          } else {
            Connection.setStatus(false);
            Toast.error(result.message || 'Ошибка сохранения');
          }
        } catch (err) {
          Connection.setStatus(false);
        }
      },

      saveDebounced() {
        if (!State.settings.serverUrl || !State.settings.heroCode) return;

        if (State.syncTimeout) clearTimeout(State.syncTimeout);
        State.syncTimeout = setTimeout(() => this.save(), Config.DEBOUNCE_MS);
      },

      async roll(dice) {
        if (!State.settings.serverUrl || !State.settings.heroCode || !State.isOnline) {
          return null;
        }

        try {
          const result = await this.request('/api/roll', {
            code: State.settings.heroCode,
            dice: dice
          });

          if (result.status === 'ok') {
            return result;
          }
          return null;
        } catch (err) {
          return null;
        }
      }
    };

    // ============================================================
    // UI MODULE
    // ============================================================
    const UI = {
      updateLastSync() {
        const el = document.getElementById('lastSync');
        if (State.updatedAt) {
          const date = new Date(State.updatedAt);
          el.textContent = `Последняя синхронизация: ${date.toLocaleString('ru-RU')} (v${State.version})`;
        } else {
          el.textContent = '';
        }
      },

      handleFieldChange(e) {
        API.saveDebounced();
      },

      handleSettingsChange(e) {
        const id = e.target.id;
        let value = e.target.value;

        State.settings[id] = value;
        Storage.saveSettings();
      }
    };

    // ============================================================
    // EVENTS
    // ============================================================
    const Events = {
      setup() {
        document.querySelectorAll("button.panel-toggle").forEach(btn => {
          btn.addEventListener('click', (e) => {
            let targetId = e.currentTarget.dataset.panelToggleTarget;
            e.currentTarget.classList.toggle('open');
            document.getElementById(targetId).classList.toggle('open');
          });
        });

        // Settings fields
        ['serverUrl', 'heroCode'].forEach(id => {
          document.getElementById(id).addEventListener('change', (e) => UI.handleSettingsChange(e));
        });

        // Load/Save buttons
        document.getElementById('loadBtn').addEventListener('click', () => API.load());
        document.getElementById('saveNowBtn').addEventListener('click', () => {
          API.save();
          Toast.info('Сохранение...');
        });

        // Character fields
        document.querySelectorAll('[data-sync-id]').forEach(el => {
          el.addEventListener('input', (e) => UI.handleFieldChange(e));
          el.addEventListener('change', (e) => UI.handleFieldChange(e));
        });

        // Dice
        document.querySelectorAll('.dice-btn').forEach(btn => {
          btn.addEventListener('click', () => Dice.execute(btn.dataset.dice, { State, Config, API }));
        });

        // Dice panel toggle (mobile)
        document.getElementById('dicePanelToggle').addEventListener('click', () => {
          document.getElementById('dicePanel').classList.toggle('open');
        });

        // Number spinner buttons
        document.querySelectorAll('.btn-spinner').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            const targetId = btn.dataset.target;
            const action = btn.dataset.action;
            const input = document.getElementById(targetId);

            if (!input) return;

            let currentValue = parseInt(input.value) || 0;
            const min = input.min ? parseInt(input.min) : -Infinity;
            const max = input.max ? parseInt(input.max) : Infinity;

            if (action === 'increment') {
              currentValue = Math.min(currentValue + 1, max);
            } else if (action === 'decrement') {
              currentValue = Math.max(currentValue - 1, min);
            }

            input.value = currentValue;

            // Trigger change event to save
            input.dispatchEvent(new Event('input', { bubbles: true }));
            input.dispatchEvent(new Event('change', { bubbles: true }));
          });
        });

        // Party refresh
        document.getElementById('partyRefresh').addEventListener('click', () => Party.load({ State, API }));
      }
    };


    async function init() {
      Storage.loadSettings();

      // Update settings UI
      document.getElementById('serverUrl').value = State.settings.serverUrl || '';
      document.getElementById('heroCode').value = State.settings.heroCode || '';

      UI.updateLastSync();
      Events.setup();

      if (State.settings.serverUrl && State.settings.heroCode) {
        await API.load();
      } else {
        Connection.setStatus(false);
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>

</html>
