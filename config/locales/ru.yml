ru:
  activerecord:
    errors:
      messages:
        record_invalid: 'Возникли ошибки: %{errors}'
        restrict_dependent_destroy:
          has_one: 'Невозможно удалить запись, так как существует зависимость: %{record}'
          has_many: 'Невозможно удалить запись, так как существуют зависимости: %{record}'
  date:
    abbr_day_names:
    - Вс
    - Пн
    - Вт
    - Ср
    - Чт
    - Пт
    - Сб
    abbr_month_names:
    - 
    - янв.
    - февр.
    - марта
    - апр.
    - мая
    - июня
    - июля
    - авг.
    - сент.
    - окт.
    - нояб.
    - дек.
    day_names:
    - воскресенье
    - понедельник
    - вторник
    - среда
    - четверг
    - пятница
    - суббота
    formats:
      default: "%d.%m.%Y"
      long: "%-d %B %Y"
      short: "%-d %b"
    month_names:
    - 
    - января
    - февраля
    - марта
    - апреля
    - мая
    - июня
    - июля
    - августа
    - сентября
    - октября
    - ноября
    - декабря
    order:
    - :day
    - :month
    - :year
  datetime:
    distance_in_words:
      about_x_hours:
        one: около %{count} часа
        few: около %{count} часов
        many: около %{count} часов
        other: около %{count} часов
      about_x_months:
        one: около %{count} месяца
        few: около %{count} месяцев
        many: около %{count} месяцев
        other: около %{count} месяцев
      about_x_years:
        one: около %{count} года
        few: около %{count} лет
        many: около %{count} лет
        other: около %{count} лет
      almost_x_years:
        one: почти %{count} год
        few: почти %{count} года
        many: почти %{count} лет
        other: почти %{count} лет
      half_a_minute: полминуты
      less_than_x_seconds:
        one: меньше %{count} секунды
        few: меньше %{count} секунд
        many: меньше %{count} секунд
        other: меньше %{count} секунд
      less_than_x_minutes:
        one: меньше %{count} минуты
        few: меньше %{count} минут
        many: меньше %{count} минут
        other: меньше %{count} минут
      over_x_years:
        one: больше %{count} года
        few: больше %{count} лет
        many: больше %{count} лет
        other: больше %{count} лет
      x_seconds:
        one: "%{count} секунда"
        few: "%{count} секунды"
        many: "%{count} секунд"
        other: "%{count} секунд"
      x_minutes:
        one: "%{count} минута"
        few: "%{count} минуты"
        many: "%{count} минут"
        other: "%{count} минут"
      x_days:
        one: "%{count} день"
        few: "%{count} дня"
        many: "%{count} дней"
        other: "%{count} дней"
      x_months:
        one: "%{count} месяц"
        few: "%{count} месяца"
        many: "%{count} месяцев"
        other: "%{count} месяцев"
      x_years:
        one: "%{count} год"
        few: "%{count} года"
        many: "%{count} лет"
        other: "%{count} лет"
    prompts:
      second: Секунда
      minute: Минута
      hour: Час
      day: День
      month: Месяц
      year: Год
  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: нужно подтвердить
      blank: не может быть пустым
      confirmation: не совпадает со значением поля %{attribute}
      empty: не может быть пустым
      equal_to: может иметь лишь значение, равное %{count}
      even: может иметь лишь четное значение
      exclusion: имеет зарезервированное значение
      greater_than: может иметь значение большее %{count}
      greater_than_or_equal_to: может иметь значение большее или равное %{count}
      in: должно быть в диапазоне %{count}
      inclusion: имеет непредусмотренное значение
      invalid: имеет неверное значение
      less_than: может иметь значение меньшее чем %{count}
      less_than_or_equal_to: может иметь значение меньшее или равное %{count}
      model_invalid: 'Возникли ошибки: %{errors}'
      not_a_number: не является числом
      not_an_integer: не является целым числом
      odd: может иметь лишь нечетное значение
      other_than: должно отличаться от %{count}
      present: нужно оставить пустым
      required: не может отсутствовать
      taken: уже существует
      too_long:
        one: слишком большой длины (не может быть больше чем %{count} символ)
        few: слишком большой длины (не может быть больше чем %{count} символа)
        many: слишком большой длины (не может быть больше чем %{count} символов)
        other: слишком большой длины (не может быть больше чем %{count} символа)
      too_short:
        one: недостаточной длины (не может быть меньше %{count} символа)
        few: недостаточной длины (не может быть меньше %{count} символов)
        many: недостаточной длины (не может быть меньше %{count} символов)
        other: недостаточной длины (не может быть меньше %{count} символа)
      wrong_length:
        one: неверной длины (может быть длиной ровно %{count} символ)
        few: неверной длины (может быть длиной ровно %{count} символа)
        many: неверной длины (может быть длиной ровно %{count} символов)
        other: неверной длины (может быть длиной ровно %{count} символа)
    template:
      body: 'Проблемы возникли со следующими полями:'
      header:
        one: "%{model}: сохранение не удалось из-за %{count} ошибки"
        few: "%{model}: сохранение не удалось из-за %{count} ошибок"
        many: "%{model}: сохранение не удалось из-за %{count} ошибок"
        other: "%{model}: сохранение не удалось из-за %{count} ошибки"
  helpers:
    select:
      prompt: 'Выберите: '
    submit:
      create: Создать %{model}
      submit: Сохранить %{model}
      update: Сохранить %{model}
  number:
    currency:
      format:
        delimiter: " "
        format: "%n %u"
        precision: 2
        separator: ","
        significant: false
        strip_insignificant_zeros: false
        unit: руб.
    format:
      delimiter: " "
      precision: 3
      round_mode: default
      separator: ","
      significant: false
      strip_insignificant_zeros: false
    human:
      decimal_units:
        format: "%n %u"
        units:
          billion:
            one: миллиард
            few: миллиардов
            many: миллиардов
            other: миллиардов
          million:
            one: миллион
            few: миллионов
            many: миллионов
            other: миллионов
          quadrillion:
            one: квадриллион
            few: квадриллионов
            many: квадриллионов
            other: квадриллионов
          thousand:
            one: тысяча
            few: тысяч
            many: тысяч
            other: тысяч
          trillion:
            one: триллион
            few: триллионов
            many: триллионов
            other: триллионов
          unit: ''
      format:
        delimiter: ''
        precision: 1
        significant: false
        strip_insignificant_zeros: false
      storage_units:
        format: "%n %u"
        units:
          byte:
            one: байт
            few: байта
            many: байт
            other: байта
          eb: ЭБ
          gb: ГБ
          kb: КБ
          mb: МБ
          pb: ПБ
          tb: ТБ
    percentage:
      format:
        delimiter: ''
        format: "%n%"
    precision:
      format:
        delimiter: ''
  support:
    array:
      last_word_connector: " и "
      two_words_connector: " и "
      words_connector: ", "
  time:
    am: утра
    formats:
      default: "%a, %d %b %Y, %H:%M:%S %z"
      long: "%d %B %Y, %H:%M"
      short: "%d %b, %H:%M"
    pm: вечера

  # In game content
  dungeon_world:
    text:
      of: "из"
      base:
        level: "уровень"
        xp: "опыты"
        coins: "монеты"
        hp_current: "здоровье"
        armor: "броня"
        damage: "урон"
      stats:
        str: "сил"
        dex: "лов"
        con: "тел"
        int: "инт"
        wis: "муд"
        cha: "хар"

    origin:
      human: "человек"
      elf: "эльф"
      dark_elf: "темный эльф"
      high_elf: "высший эльф"
      dwarf: "дворф"
      gnome: "гном"
      orc: "орк"
      troll: "троль"
      goblin: "гоблин"
      tauren: "таурен"
      tiefling: "тифлинг"
      frog_folk: "лягуха"
      turtle_folk: "черепаха"
      # homebrew
      yar_human: "человек из яра"
      yar_dog_folk: "песий люд"
      yar_elf: "эльф из яра"
    klass:
      bard: "бард"
      priest: "жрец" # cleric
      druid: "друид"
      fighter: "мастер оружия"
      paladin: "паладин"
      ranger: "стрелок"
      thief: "вор"
      wizard: "волшебник"
      # homebrew
      yar_berserk: "берсерк"
      yar_path_master: "находящий пути"
      yar_rune_master: "рунари"
      yar_evil_hunter: "охотник на нелюдь"
    abilities:
      lang:
        common:
          name: "Всеобщий"
          description: "Вы можете говорить, читать и писать на Всеобщем, торговом языке, на котором говорят в большинстве цивилизованных земель."
        dwarf:
          name: "Дворфийский"
          description: "Вы можете говорить, читать и писать на Дворфийском, древнем языке горных залов и камня."
        elf:
          name: "Эльфийский"
          description: "Вы можете говорить, читать и писать на Эльфийском, текучем языке лесов и древней магии."
        undercommon:
          name: "Подземный"
          description: "Вы можете говорить на Подземном, грубом торговом языке Подземья."
        gnome:
          name: "Гномий"
          description: "Вы можете говорить, читать и писать на Гномьем, полном технического жаргона и загадок."
        orc:
          name: "Орочий"
          description: "Вы можете говорить на Орочьем, жестком языке войны и племен."
        troll:
          name: "Троллий"
          description: "Вы можете говорить на Троллье, гортанном языке дикой природы."
        goblin:
          name: "Гоблинский"
          description: "Вы можете говорить на Гоблинском, быстром и стрекочущем языке гоблиноидов."
        tauren:
          name: "Таурен"
          description: "Вы можете говорить на Таурене, глубоком языке степного народа."
        infernal:
          name: "Инфернальный"
          description: "Вы можете говорить на Инфернальном, извращенном языке дьяволов и темных договоров."
        frog:
          name: "Лягушачий"
          description: "Вы можете говорить на квакающем языке лягушачьего народа."
        turtle:
          name: "Черепаший"
          description: "Вы можете говорить на медленном, размеренном языке черепашьего народа."
        yar:
          name: "Яр"
          description: "Вы можете говорить на Яре, пограничном языке суровых северных земель."
      senses:
        darkvision:
          name: "Темное зрение"
          description: "Вы можете видеть в темноте, как при тусклом свете, на расстоянии до 60 футов. В темноте вы не различаете цвета, только оттенки серого."
        keen_senses:
          name: "Острые чувства"
          description: "Ваши чувства остры. Когда вы Различаете Реальность, вы можете задать один дополнительный вопрос, даже при 6-."
        keen_nose:
          name: "Острый нюх"
          description: "Ваше обоняние исключительно. Вы можете выслеживать по запаху и обнаруживать ближайших существ только по запаху."
      size:
        small:
          name: "Маленький"
          description: "Вы маленький и проворный. Вы можете пролезать через узкие пространства и вас сложнее ударить, но ваша нагрузка уменьшена."
        massive:
          name: "Массивный"
          description: "Вы огромны и внушительны. Вы не можете пролезть через маленькие пространства, но вы получаете +1 к броне и наносите +1к4 урона атаками ближнего боя."
      movement:
        swimmer:
          name: "Пловец"
          description: "Вы прирожденный пловец. Вы можете дышать под водой и двигаться в воде на полной скорости без штрафов."
        leap:
          name: "Могучий прыжок"
          description: "Ваши мощные ноги позволяют вам прыгать на большие расстояния. Вы можете прыгнуть на 20 футов по горизонтали или 10 футов по вертикали."
      defense:
        regeneration:
          name: "Регенерация"
          description: "В начале вашего хода, если у вас есть хотя бы 1 ХП, вы лечите 1к4 ХП. Урон от огня и кислоты предотвращает это исцеление до вашего следующего хода."
        shell:
          name: "Природный панцирь"
          description: "Ваш панцирь обеспечивает естественную броню. У вас +1 к броне, или +3 к броне, когда вы прячетесь в панцирь (но вы не можете двигаться или атаковать)."
      physical:
        strength:
          name: "Могучий"
          description: "Вы исключительно сильны. Когда вы наносите урон в ближнем бою, вы наносите +1к4 урона."
        hooves:
          name: "Копыта"
          description: "Ваши копыта - естественное оружие. Ваши безоружные атаки наносят 1к6 урона."
      racial:
        human:
          name: "Человеческая универсальность"
          description: "Вы мастер на все руки. Когда вы берете мультиклассовый ход, вы считаетесь на один уровень выше для выбора хода."
        dwarf:
          name: "Дварфийское знание камня"
          description: "Когда вы Различаете Реальность о каменной кладке, архитектуре или подземных проходах, вы можете задать один дополнительный вопрос и получить +1."
        elf:
          name: "Эльфийские чувства"
          description: "У вас острые чувства и восприятие. Когда вы Различаете Реальность, получите +1."
        dark_elf:
          name: "Наследие темного эльфа"
          description: "У вас есть темное зрение и вы знаете заговор Тьма (создать магическую тьму в небольшой области, которую не может пробить даже темное зрение)."
        high_elf:
          name: "Грация высшего эльфа"
          description: "Вы изучали магические искусства и двигаетесь со сверхъестественной грацией. Когда вы Изрекаете Знания о магии или Бросаете Вызов Опасности, используя ЛОВ, получите +1."
        gnome:
          name: "Гномий мастеровой"
          description: "Когда у вас есть время и материалы, вы можете создавать полезные приспособления. Опишите, что вы делаете, и Мастер скажет, какие ресурсы вам нужны."
        orc:
          name: "Орочья ярость"
          description: "Вы исключительно сильны и свирепы в бою. Когда вы наносите урон в ближнем бою, вы наносите +1к4 урона. Вы можете выбрать получить -1 постоянно, пока не успокоитесь, чтобы добавить свой уровень к урону."
        troll:
          name: "Регенерация тролля"
          description: "Вы быстро восстанавливаетесь. В начале каждого вашего хода, если у вас есть хотя бы 1 ХП, исцелите 1к4 ХП. Вы также огромного размера."
        goblin:
          name: "Гоблинская скрытность"
          description: "Вы малы и скрытны. Когда вы пытаетесь спрятаться или двигаться бесшумно, бросок+ЛОВ. При 10+ вас совершенно не обнаружат. При 7-9 вас не обнаруживают, но вы оставляете улику или след."
        tauren:
          name: "Сила таурена"
          description: "Вы исключительно сильны с мощными копытами. Когда вы наносите урон в ближнем бою, вы наносите +1к4 урона. Ваши копыта - естественное оружие, наносящее 1к6 урона."
        tiefling:
          name: "Инфернальное наследие"
          description: "У вас есть сопротивление огню (получаете половину урона, округляя вниз) и вы знаете один заговор из списка заклинаний Волшебника. У вас есть темное зрение."
        frog_folk:
          name: "Ловкость народа лягушек"
          description: "Вы отличный пловец и можете прыгать на большие расстояния. Вы можете задерживать дыхание до часа, а ваши прыжки покрывают вдвое большее расстояние."
        turtle_folk:
          name: "Панцирь народа черепах"
          description: "У вас есть защитный панцирь и вы природный пловец. Когда вы прячетесь в панцирь, получаете +2 броню, но не можете двигаться или атаковать."
        yar_human:
          name: "Стойкость яр-человека"
          description: "Вы крепки, выносливы и умелы в выживании в дикой природе. Когда вы Разбиваете Лагерь, исцелите дополнительно 1к4 ХП. Когда вы Предпринимаете Опасное Путешествие, вы можете выполнить две роли."
        yar_dog_folk:
          name: "Верность яр-собачьего народа"
          description: "У вас острое обоняние и глубокая верность. Когда вы Помогаете кому-то, с кем у вас есть связь, получите +1 к броску. Получите +1 при выслеживании по запаху."
        yar_elf:
          name: "Лесная связь яр-эльфа"
          description: "У вас мистическая связь с лесами и острые чувства. Находясь в лесу, вы всегда знаете, где север, и не можете заблудиться. Когда вы Различаете Реальность, получите +1."
      spells:
        shadow:
          name: "Теневая магия"
          description: "Вы знаете заговор Тьма (создать магическую тьму в небольшой области, которую не может пробить даже темное зрение)."
