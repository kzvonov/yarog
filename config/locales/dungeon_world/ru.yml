ru:
  dungeon_world:
    origin:
      human: "человек"
      elf: "эльф"
      dark_elf: "темный эльф"
      high_elf: "высший эльф"
      dwarf: "дворф"
      gnome: "гном"
      orc: "орк"
      troll: "троль"
      goblin: "гоблин"
      tauren: "таурен"
      tiefling: "тифлинг"
      frog_folk: "лягуха"
      turtle_folk: "черепаха"
      # homebrew
      yar_human: "человек из яра"
      yar_dog_folk: "песий люд"
      yar_elf: "эльф из яра"
    klass:
      bard: "бард"
      cleric: "жрец"
      druid: "друид"
      fighter: "мастер оружия"
      paladin: "паладин"
      ranger: "стрелок"
      thief: "вор"
      wizard: "волшебник"
      # homebrew
      yar_berserk: "берсерк"
      yar_path_master: "находящий пути"
      yar_rune_master: "рунари"
      yar_evil_hunter: "охотник на нелюдь"

    # =========================================================================
    # ЯЗЫКИ
    # =========================================================================
    lang:
      common:
        name: "Общий"
        description: "Вы говорите, читаете и пишете на Общем — торговом языке цивилизованных земель."
      dwarf:
        name: "Дварфийский"
        description: "Вы говорите, читаете и пишете на Дварфийском — древнем языке горных залов и камня."
      elf:
        name: "Эльфийский"
        description: "Вы говорите, читаете и пишете на Эльфийском — певучем языке древних лесов и старой магии."
      undercommon:
        name: "Подземный"
        description: "Вы говорите на Подземном — грубом торговом языке Подземья."
      gnome:
        name: "Гномий"
        description: "Вы говорите, читаете и пишете на Гномьем — языке, полном технического жаргона и слоёных загадок."
      orc:
        name: "Орочий"
        description: "Вы говорите на Орочьем — резком языке военных отрядов и племён."
      troll:
        name: "Троллий"
        description: "Вы говорите на Тролльем — гортанном языке глухих чащоб."
      goblin:
        name: "Гоблинский"
        description: "Вы говорите на Гоблинском — быстром и стрекочущем языке гоблиноидов."
      tauren:
        name: "Тауренский"
        description: "Вы говорите на Тауренском — глубоком и звучном языке народов равнин."
      infernal:
        name: "Инфернальный"
        description: "Вы говорите на Инфернальном — извращённом языке дьяволов и тёмных договоров."
      frog:
        name: "Лягушачий"
        description: "Вы говорите на квакающем языке народа лягушек."
      turtle:
        name: "Черепаший"
        description: "Вы говорите на медленном и взвешенном языке народа черепах."
      yar:
        name: "Ярский"
        description: "Вы говорите на Ярском — пограничном языке суровых северных земель."

    # =========================================================================
    # РАСОВЫЕ ЧЕРТЫ
    # =========================================================================
    racial:
      human:
        name: "Человеческая Гибкость"
        description: "Когда вы берёте мультиклассовое умение, считайте свой уровень на единицу выше при его выборе."
        level: 0
        type: "пассивная"
      dwarf:
        name: "Дварфийское Чутьё"
        description: "Когда вы Различаете Реальность в вопросах каменной кладки или подземных ходов, задайте один дополнительный вопрос и возьмите +1."
        level: 0
        type: "пассивная"
      elf:
        name: "Эльфийская Грация"
        description: "Ваши чувства остры от природы. Когда вы Различаете Реальность, возьмите +1."
        level: 0
        type: "пассивная"
      dark_elf:
        name: "Наследие Тёмного Эльфа"
        description: "У вас тёмное зрение, и вы знаете заклинание Тьма — создайте магическую тень, непроницаемую даже для тёмного зрения."
        level: 0
        type: "пассивная"
      high_elf:
        name: "Высшая Эльфийская Арканность"
        description: "Когда вы Изрекаете Знания о магии или Избегаете Опасности с ЛОВ, возьмите +1."
        level: 0
        type: "пассивная"
      gnome:
        name: "Гномий Мастер"
        description: "Имея время и материалы, вы можете создавать полезные устройства. Опишите, что делаете — Мастер скажет, что для этого нужно."
        level: 0
        type: "пассивная"
      orc:
        name: "Орочья Ярость"
        description: "При нанесении урона в ближнем бою добавьте +1к4. Вы можете взять -1 постоянно, чтобы добавить свой уровень к нанесённому урону."
        level: 0
        type: "пассивная"
      troll:
        name: "Троллья Регенерация"
        description: "В начале своего хода, если у вас есть хотя бы 1 ОЗ, восстановите 1к4. Огонь и кислота блокируют это до следующего хода. Вы огромны."
        level: 0
        type: "пассивная"
      goblin:
        name: "Гоблинская Скрытность"
        description: "Вы маленький и юркий. Бросок+ЛОВ чтобы спрятаться или двигаться тихо. 10+: полностью незамечены. 7-9: незамечены, но оставили след."
        level: 0
        type: "бросок:ЛОВ"
      tauren:
        name: "Тауренская Сила"
        description: "При нанесении урона в ближнем бою добавьте +1к4. Ваши копыта — природное оружие, наносящее 1к6 урона."
        level: 0
        type: "пассивная"
      tiefling:
        name: "Инфернальное Наследие"
        description: "Вы получаете половину урона от огня (округляется вниз), знаете один заговор Волшебника и обладаете тёмным зрением."
        level: 0
        type: "пассивная"
      frog_folk:
        name: "Ловкость Народа Лягушек"
        description: "Вы отличный пловец, можете задержать дыхание на час и прыгаете вдвое дальше обычного."
        level: 0
        type: "пассивная"
      turtle_folk:
        name: "Панцирь Народа Черепах"
        description: "У вас защитный панцирь, и вы прирождённый пловец. Спрятавшись в панцирь, получите +2 брони, но не можете двигаться или атаковать."
        level: 0
        type: "пассивная"
      yar_human:
        name: "Ярская Стойкость"
        description: "Когда вы Разбиваете Лагерь, восстановите дополнительно 1к4 ОЗ. При Опасном Путешествии вы можете занять две роли."
        level: 0
        type: "пассивная"
      yar_dog_folk:
        name: "Преданность Народа Собак"
        description: "Когда вы Помогаете кому-то, с кем у вас есть Связь, возьмите +1 к броску. Возьмите +1 при слежке по запаху."
        level: 0
        type: "пассивная"
      yar_elf:
        name: "Лесная Связь Ярского Эльфа"
        description: "В лесу вы всегда знаете, где север, и не можете заблудиться. Когда вы Различаете Реальность, возьмите +1."
        level: 0
        type: "пассивная"

    # =========================================================================
    # МУЛЬТИКЛАССОВЫЕ УМЕНИЯ
    # =========================================================================
    move:
      multiclass_dabbler:
        name: "Мультиклассовый Дилетант"
        description: "Получите одно умение другого класса. При его выборе считайте свой уровень на единицу ниже."
        level: 2
        type: "пассивная"
      multiclass_initiate:
        name: "Мультиклассовый Посвящённый"
        description: "Получите одно умение другого класса. При его выборе считайте свой уровень на единицу ниже. Требует: Мультиклассовый Дилетант."
        level: 6
        type: "пассивная"
      multiclass_master:
        name: "Мультиклассовый Мастер"
        description: "Получите одно умение другого класса. При его выборе считайте свой уровень на единицу ниже. Требует: Мультиклассовый Посвящённый."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ БАРДА
      # =======================================================================
      arcane_art:
        name: "Тайное Искусство"
        description: "Вплетая выступление в заклинание, выберите союзника и эффект: исцелить 1к8, +1к4 к урону, снять одно чародейство или следующая помощь даёт +2. Бросок+ХАР. 10+: союзник получает эффект. 7-9: работает, но вы привлекаете внимание или эффект задевает других."
        level: 1
        type: "бросок:ХАР"
      bardic_lore:
        name: "Бардовская Мудрость"
        description: "Выберите область знаний. При первой встрече с важным существом, местом или предметом, охваченным вашей мудростью, задайте Мастеру один вопрос — он ответит правдиво."
        level: 1
        type: "пассивная"
      charming_and_open:
        name: "Обаятельный и Открытый"
        description: "Когда вы говорите с кем-то откровенно, задайте игроку персонажа один вопрос из списка. Он должен ответить правдиво, затем может задать вам один вопрос в ответ."
        level: 1
        type: "пассивная"
      port_in_the_storm:
        name: "Тихая Гавань"
        description: "Когда вы возвращаетесь в знакомое поселение, скажите Мастеру, когда были здесь последний раз. Он расскажет, что изменилось с тех пор."
        level: 1
        type: "пассивная"
      healing_song:
        name: "Исцеляющая Песня"
        description: "Когда вы исцеляете с помощью Тайного Искусства, вы исцеляете дополнительно +1к8."
        level: 2
        type: "пассивная"
      vicious_cacophony:
        name: "Жестокий Какофон"
        description: "Когда вы наделяете бонусным уроном через Тайное Искусство, вы наделяете дополнительно +1к4 урона."
        level: 2
        type: "пассивная"
      it_goes_to_eleven:
        name: "До Одиннадцати"
        description: "Когда вы устраиваете безумное представление, выберите слышащую вас цель и бросьте+ХАР. 10+: она атакует ближайшего союзника. 7-9: атакует союзника, но и вы привлекаете её враждебность."
        level: 2
        type: "бросок:ХАР"
      metal_hurlant:
        name: "Металлический Вопль"
        description: "Когда вы кричите с огромной силой или играете сокрушительную ноту, выберите цель и бросьте+ТЕЛ. 10+: 1к10 урона и оглушение на несколько минут. 7-9: всё равно наносите урон, но Мастер выбирает дополнительную цель."
        level: 2
        type: "бросок:ТЕЛ"
      a_little_help_from_my_friends:
        name: "Помощь Друзей"
        description: "Когда вы успешно Помогаете кому-то, вы тоже берёте +1 вперёд."
        level: 2
        type: "пассивная"
      eldritch_tones:
        name: "Мистические Тона"
        description: "Ваше Тайное Искусство усилилось. Используя его, выбирайте два эффекта вместо одного."
        level: 2
        type: "пассивная"
      duelist_parry:
        name: "Дуэльный Парирующий Удар"
        description: "Когда вы Рубите и Режете, берёте +1 брони вперёд."
        level: 2
        type: "пассивная"
      bamboozle:
        name: "Запутать"
        description: "Когда вы Ведёте Переговоры с кем-то и получаете 7+, также берёте +1 вперёд с ним."
        level: 2
        type: "пассивная"
      healing_chorus:
        name: "Исцеляющий Хор"
        description: "Заменяет Исцеляющую Песню. Когда вы исцеляете с помощью Тайного Искусства, вы исцеляете дополнительно +2к8."
        level: 6
        type: "пассивная"
      vicious_blast:
        name: "Жестокий Взрыв"
        description: "Заменяет Жестокий Какофон. Когда вы наделяете бонусным уроном через Тайное Искусство, вы наделяете дополнительно +2к4 урона."
        level: 6
        type: "пассивная"
      unforgettable_face:
        name: "Незабываемое Лицо"
        description: "Когда вы встречаете кого-то после разлуки, берёте +1 вперёд против него."
        level: 6
        type: "пассивная"
      reputation:
        name: "Репутация"
        description: "Когда вы впервые встречаете того, кто слышал о вас песни, бросьте+ХАР. 10+: назовите Мастеру две вещи, которые о вас слышали. 7-9: назовите одну, и Мастер назовёт одну."
        level: 6
        type: "бросок:ХАР"
      eldritch_chord:
        name: "Мистический Аккорд"
        description: "Заменяет Мистические Тона. Используя Тайное Искусство, выбирайте два эффекта и удваивайте один из них."
        level: 6
        type: "пассивная"
      an_ear_for_magic:
        name: "Слух к Магии"
        description: "Когда вы слышите, как враг творит заклинание, Мастер называет его имя и эффект. Действуя на основе этих знаний, берёте +1 вперёд."
        level: 6
        type: "пассивная"
      devious:
        name: "Хитрец"
        description: "Используя Обаятельного и Открытого, вы также можете спросить: «Как вы уязвимы передо мной?» Собеседник не может задать вам этот вопрос."
        level: 6
        type: "пассивная"
      duelist_block:
        name: "Дуэльный Блок"
        description: "Заменяет Дуэльный Парирующий Удар. Когда вы Рубите и Режете, берёте +2 брони вперёд."
        level: 6
        type: "пассивная"
      con:
        name: "Афера"
        description: "Заменяет Запутать. Когда вы Ведёте Переговоры и получаете 7+, берёте +1 вперёд с собеседником и задаёте его игроку вопрос, на который тот обязан ответить правдиво."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ЖРЕЦА
      # =======================================================================
      deity:
        name: "Божество"
        description: "Вы служите богу. Назовите своё божество, выберите домен и постулат. Постулат определяет, как вы просите о Божественном Руководстве."
        level: 1
        type: "пассивная"
      divine_guidance:
        name: "Божественное Руководство"
        description: "Когда вы обращаетесь к своему богу согласно постулату своей религии, вы получаете полезные знания или благосклонность в рамках домена вашего бога."
        level: 1
        type: "пассивная"
      turn_undead:
        name: "Отогнать Нежить"
        description: "Когда вы поднимаете святой символ и взываете к своему богу, бросьте+МУД. 7+: нежить не приближается, пока вы молитесь. 10+: также ошеломляет разумную нежить и обращает в бегство бессмысленную."
        level: 1
        type: "бросок:МДР"
      commune:
        name: "Причастие"
        description: "Проведя час в тихом общении, утратьте дарованные заклинания и получите новые, чей суммарный уровень не превышает ваш уровень+1. Все ритуальные заклинания подготавливаются бесплатно."
        level: 1
        type: "пассивная"
      cast_a_spell:
        name: "Сотворить Заклинание"
        description: "Когда вы высвобождаете дарованное заклинание, бросьте+МУД. 10+: заклинание сотворено, бог его не отзывает. 7-9: сотворено, но выберите одно: нежелательное внимание, -1 постоянно к сотворению, или заклинание отозвано до следующего Причастия."
        level: 1
        type: "бросок:МДР"
      chosen_one:
        name: "Избранный"
        description: "Выберите одно заклинание. Оно даруется вам так, словно его уровень на единицу ниже."
        level: 2
        type: "пассивная"
      invigorate:
        name: "Воодушевить"
        description: "Когда вы исцеляете кого-то, он берёт +2 вперёд к урону."
        level: 2
        type: "пассивная"
      scales_of_life_and_death:
        name: "Весы Жизни и Смерти"
        description: "Когда кто-то делает последний вдох в вашем присутствии, он берёт +1 к броску."
        level: 2
        type: "пассивная"
      serenity:
        name: "Спокойствие"
        description: "Когда вы творите заклинание, игнорируйте первый штраф -1 от постоянных заклинаний."
        level: 2
        type: "пассивная"
      first_aid:
        name: "Первая Помощь"
        description: "Лечение Лёгких Ран — ваше ритуальное заклинание и не считается в лимит дарованных заклинаний."
        level: 2
        type: "пассивная"
      divine_intervention:
        name: "Божественное Вмешательство"
        description: "После Причастия получите 1 запас. Потратьте его, когда вы или союзник получают урон, чтобы призвать бога — тот нейтрализует урон."
        level: 2
        type: "пассивная"
      penitent:
        name: "Кающийся"
        description: "Когда вы принимаете урон и принимаете боль, вы можете взять +1к4 урона (игнорируя броню). Если так, берёте +1 вперёд к сотворению заклинания."
        level: 2
        type: "пассивная"
      empower:
        name: "Усилить"
        description: "Когда вы творите заклинание и получаете 10+, можете выбрать из списка 7-9 и также выбрать одно: удвоить эффекты или удвоить цели."
        level: 2
        type: "пассивная"
      orison_for_guidance:
        name: "Молитва Руководства"
        description: "Когда вы жертвуете чем-то ценным и молитесь о руководстве, ваш бог говорит, чего хотел бы от вас. Если вы это сделаете — отметьте опыт."
        level: 2
        type: "пассивная"
      divine_protection:
        name: "Божественная Защита"
        description: "Когда вы не носите брони или щита, у вас 2 брони."
        level: 2
        type: "пассивная"
      devoted_healer:
        name: "Преданный Целитель"
        description: "Когда вы исцеляете кого-то другого, добавьте свой уровень к объёму исцеления."
        level: 2
        type: "пассивная"
      anointed:
        name: "Помазанник"
        description: "Требует: Избранный. Выберите ещё одно заклинание. Оно даруется вам так, словно его уровень на единицу ниже."
        level: 6
        type: "пассивная"
      apotheosis:
        name: "Апофеоз"
        description: "В следующий раз, выйдя из молитвы, выберите черту, связанную с вашим богом. Вы навсегда приобретаете эту физическую особенность."
        level: 6
        type: "пассивная"
      reaper:
        name: "Жнец"
        description: "Когда после конфликта вы посвящаете победу своему богу и занимаетесь павшими, берёте +1 вперёд."
        level: 6
        type: "пассивная"
      providence:
        name: "Провидение"
        description: "Заменяет Спокойствие. Вы игнорируете штраф -1 от двух поддерживаемых вами заклинаний."
        level: 6
        type: "пассивная"
      greater_first_aid:
        name: "Расширенная Первая Помощь"
        description: "Требует: Первая Помощь. Лечение Умеренных Ран — ваше ритуальное заклинание и не считается в лимит."
        level: 6
        type: "пассивная"
      divine_invincibility:
        name: "Божественная Неуязвимость"
        description: "Заменяет Божественное Вмешательство. После Причастия получите 2 запаса для нейтрализации урона у вас или союзника."
        level: 6
        type: "пассивная"
      martyr:
        name: "Мученик"
        description: "Заменяет Кающегося. Принимая боль (+1к4 урона игнорируя броню), берёте +1 вперёд к сотворению и добавляете уровень к урону или исцелению этого заклинания."
        level: 6
        type: "пассивная"
      divine_armor:
        name: "Божественная Броня"
        description: "Заменяет Божественную Защиту. Когда вы не носите брони или щита, у вас 3 брони."
        level: 6
        type: "пассивная"
      greater_empower:
        name: "Великое Усиление"
        description: "Заменяет Усилить. При 10-11 выберите из списка 7-9 и добавьте бонусный эффект. При 12+ получите один бонусный эффект бесплатно."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ДРУИДА
      # =======================================================================
      born_of_the_soil:
        name: "Рождённый Землёй"
        description: "Выберите землю, с которой вы связаны. При превращении вы можете принять облик любого животного, обитающего в ней."
        level: 1
        type: "пассивная"
      by_nature_sustained:
        name: "Питаемый Природой"
        description: "Вам не нужны еда и вода. Когда умение велит вычеркнуть паёк — игнорируйте это."
        level: 1
        type: "пассивная"
      spirit_tongue:
        name: "Язык Духов"
        description: "Звуки существ дикой природы — это для вас речь. Вы понимаете любое животное из вашей земли или родственное изученному."
        level: 1
        type: "пассивная"
      shapeshifter:
        name: "Перевёртыш"
        description: "Призывая духов изменить облик, бросьте+МУД. 10+: 3 запаса. 7-9: 2. Промах: 1. Принимайте облик изученных существ; тратьте запасы на их умения. Потратив все запасы — возвращайтесь к своей форме."
        level: 1
        type: "бросок:МДР"
      studied_essence:
        name: "Изученная Сущность"
        description: "Проведя время в созерцании духа животного, добавьте его вид в список доступных для превращения."
        level: 1
        type: "пассивная"
      hunters_brother:
        name: "Брат Охотника"
        description: "Выберите одно умение из списка класса Следопыт."
        level: 2
        type: "пассивная"
      red_of_tooth_and_claw:
        name: "В Крови и Когтях"
        description: "Находясь в облике опасного животного, увеличьте свой урон до к8."
        level: 2
        type: "пассивная"
      communion_of_whispers:
        name: "Причастие Шёпотов"
        description: "Читая духов места, бросьте+МУД. 10+: ясное, полезное видение. 7-9: туманное и непонятное. Промах: пугающее или травмирующее. Берёте -1 вперёд."
        level: 2
        type: "бросок:МДР"
      barkskin:
        name: "Кора"
        description: "Пока ваши ноги касаются земли, у вас +1 брони."
        level: 2
        type: "пассивная"
      eyes_of_the_tiger:
        name: "Глаза Тигра"
        description: "Пометив животное грязью, кровью или землёй, вы видите его глазами на любом расстоянии. Помечено может быть только одно животное."
        level: 2
        type: "пассивная"
      shed:
        name: "Сброс"
        description: "Получив урон в облике животного, вы можете вернуться в свою истинную форму, чтобы нейтрализовать этот урон."
        level: 2
        type: "пассивная"
      thing_talker:
        name: "Говорящий с Вещами"
        description: "Вы видите духов в песке, море и камне. Применяйте Язык Духов, Перевёртыша и Изученную Сущность к неживым природным объектам."
        level: 2
        type: "пассивная"
      formcrafter:
        name: "Мастер Форм"
        description: "При превращении выберите характеристику: вы берёте +1 постоянно к броскам с ней в облике. Мастер тоже выбирает характеристику: к ней вы берёте -1 постоянно."
        level: 2
        type: "пассивная"
      elemental_mastery:
        name: "Власть над Стихиями"
        description: "Взывая к первобытным духам огня, воды, земли или воздуха, бросьте+МУД. 10+: выберите два. 7-9: одно — эффект происходит, вы избегаете цены природы, или сохраняете контроль."
        level: 2
        type: "бросок:МДР"
      balance:
        name: "Равновесие"
        description: "Нанося урон, получайте 1 баланс. Прикоснувшись к кому-то и направив духов жизни, тратьте баланс: каждая единица восстанавливает 1к4 ОЗ."
        level: 2
        type: "пассивная"
      embracing_no_form:
        name: "Принять Любую Форму"
        description: "При превращении бросьте 1к4 и добавьте результат к своему запасу."
        level: 6
        type: "пассивная"
      doppelgangers_dance:
        name: "Танец Доппельгангера"
        description: "Вы можете изучить сущность конкретных личностей и принять их точный облик. Подавление своей приметы возможно, но стоит -1 постоянно до возвращения к своей форме."
        level: 6
        type: "пассивная"
      blood_and_thunder:
        name: "В Крови и Громе"
        description: "Заменяет «В Крови и Когтях». Находясь в облике опасного животного, увеличьте свой урон до к10."
        level: 6
        type: "пассивная"
      the_druid_sleep:
        name: "Сон Друида"
        description: "Один раз, имея время и подходящее место, настройтесь на новую землю. Мастер назовёт цену и время. С тех пор вы считаетесь Рождённым Землёй обеих территорий."
        level: 6
        type: "пассивная"
      world_talker:
        name: "Говорящий с Миром"
        description: "Требует: Говорящий с Вещами. Применяйте свои умения к чистым стихиям — огню, воде, воздуху и земле."
        level: 6
        type: "пассивная"
      stalkers_sister:
        name: "Сестра Следопыта"
        description: "Выберите одно умение из списка класса Следопыт."
        level: 6
        type: "пассивная"
      formshaper:
        name: "Лепщик Форм"
        description: "Требует: Мастер Форм. В облике животного увеличьте броню на 1 или наносите +1к4 урона. Выбирайте при превращении."
        level: 6
        type: "пассивная"
      chimera:
        name: "Химера"
        description: "При превращении объедините до трёх разных форм. Каждая черта даёт своё умение животного."
        level: 6
        type: "пассивная"
      weather_weaver:
        name: "Ткач Погоды"
        description: "Находясь под открытым небом на рассвете, Мастер спрашивает, какой будет погода сегодня. Что бы вы ни сказали — так и будет."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ВОИНА
      # =======================================================================
      bend_bars_lift_gates:
        name: "Гнуть Прутья, Поднимать Врата"
        description: "Применяя грубую силу для разрушения препятствия, бросьте+СИЛ. 10+: выберите 3. 7-9: выберите 2 — не займёт много времени, ничего ценного не пострадает, это тихо, или можно починить потом."
        level: 1
        type: "бросок:СИЛ"
      armored:
        name: "Закалённый"
        description: "Вы игнорируете тег «неуклюжий» на любой надетой броне."
        level: 1
        type: "пассивная"
      signature_weapon:
        name: "Фирменное Оружие"
        description: "Это ваше оружие. Выберите базовый тип, дальность, два улучшения и внешний вид. Фирменное оружие никогда не покинет вас навсегда."
        level: 1
        type: "пассивная"
      merciless:
        name: "Беспощадный"
        description: "Когда вы наносите урон, добавьте +1к4."
        level: 2
        type: "пассивная"
      heirloom:
        name: "Реликвия"
        description: "Советуясь с духами своего оружия, бросьте+ХАР. 10+: Мастер даёт подробный ответ. 7-9: Мастер даёт общее впечатление."
        level: 2
        type: "бросок:ХАР"
      armor_mastery:
        name: "Мастерство Брони"
        description: "Принимая удар на броню, нейтрализуйте урон, но уменьшите значение брони или щита на 1. При уменьшении до 0 — предмет уничтожен."
        level: 2
        type: "пассивная"
      improved_weapon:
        name: "Улучшенное Оружие"
        description: "Выберите одно дополнительное улучшение для своего фирменного оружия."
        level: 2
        type: "пассивная"
      seeing_red:
        name: "Красная Пелена"
        description: "Когда вы Различаете Реальность в бою, берёте +1."
        level: 2
        type: "пассивная"
      interrogator:
        name: "Дознаватель"
        description: "Когда вы Ведёте Переговоры, используя угрозу насилия как рычаг, можете использовать СИЛ вместо ХАР."
        level: 2
        type: "пассивная"
      scent_of_blood:
        name: "Запах Крови"
        description: "Когда вы Рубите и Режете врага, ваша следующая атака против него наносит +1к4 урона."
        level: 2
        type: "пассивная"
      iron_hide:
        name: "Железная Шкура"
        description: "Вы получаете +1 брони."
        level: 2
        type: "пассивная"
      blacksmith:
        name: "Кузнец"
        description: "Имея доступ к кузнице, вы можете перенести магические свойства оружия на своё фирменное. Исходное оружие уничтожается."
        level: 2
        type: "пассивная"
      bloodthirsty:
        name: "Кровожадный"
        description: "Заменяет Беспощадного. Когда вы наносите урон, добавьте +1к8."
        level: 6
        type: "пассивная"
      armored_perfection:
        name: "Совершенство Брони"
        description: "Заменяет Мастерство Брони. Принимая удар на броню, нейтрализуйте его, берёте +1 вперёд против атакующего, но уменьшите броню на 1."
        level: 6
        type: "пассивная"
      evil_eye:
        name: "Злой Глаз"
        description: "Требует: Красная Пелена. Вступая в бой, бросьте+ХАР. 10+: 2 запаса. 7-9: 1. Тратьте запасы, чтобы встретиться взглядом с персонажем Мастера — тот застывает, пока вы не отведёте взгляд."
        level: 6
        type: "бросок:ХАР"
      taste_of_blood:
        name: "Вкус Крови"
        description: "Заменяет Запах Крови. Когда вы Рубите и Режете врага, ваша следующая атака против него наносит +1к8 урона."
        level: 6
        type: "пассивная"
      steel_hide:
        name: "Стальная Шкура"
        description: "Заменяет Железную Шкуру. Вы получаете +2 брони."
        level: 6
        type: "пассивная"
      through_deaths_eyes:
        name: "Взгляд Смерти"
        description: "Вступая в бой, бросьте+МУД. 10+: назовите того, кто выживет, и того, кто погибнет. 7-9: назовите одного. Промах: вы видите свою смерть — берёте -1 постоянно на весь бой."
        level: 6
        type: "бросок:МДР"
      eye_for_weaponry:
        name: "Глаз на Оружие"
        description: "Изучив оружие врага, спросите Мастера, сколько урона оно наносит."
        level: 6
        type: "пассивная"
      superior_warrior:
        name: "Превосходный Воин"
        description: "Когда вы Рубите и Режете и получаете 12+, наносите урон, избегаете атаки и производите впечатление на врага, пугая или обескураживая его."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ПАЛАДИНА
      # =======================================================================
      lay_on_hands:
        name: "Наложение Рук"
        description: "Прикоснувшись к кому-то кожей к коже и помолившись, бросьте+ХАР. 10+: исцелите 1к8 урона или снимите одну болезнь. 7-9: они исцелены, но урон или болезнь переходит к вам."
        level: 1
        type: "бросок:ХАР"
      i_am_the_law:
        name: "Я — Закон"
        description: "Отдавая персонажу Мастера приказ, основанный на вашей божественной власти, бросьте+ХАР. 7+: он выбирает повиноваться, бежать или атаковать. 10+: берёте +1 вперёд против него."
        level: 1
        type: "бросок:ХАР"
      quest:
        name: "Миссия"
        description: "Посвящая себя миссии через молитву и очищение, объявите цель и выберите до двух даров. Мастер назовёт обеты, необходимые для сохранения благодати."
        level: 1
        type: "пассивная"
      divine_favor:
        name: "Божественная Благосклонность"
        description: "Посвятите себя божеству. Получите умения Причастие и Сотворить Заклинание жреца, считая себя жрецом 1-го уровня. Увеличивайте эффективный уровень жреца с каждым уровнем."
        level: 2
        type: "пассивная"
      bloody_aegis:
        name: "Кровавый Эгид"
        description: "Получив урон, вы можете стиснуть зубы и принять удар: урон не причиняется, но вы получаете дебилитирующий эффект по своему выбору."
        level: 2
        type: "пассивная"
      smite:
        name: "Кара"
        description: "На миссии вы наносите +1к4 урона."
        level: 2
        type: "пассивная"
      exterminatus:
        name: "Истребление"
        description: "Произнеся вслух обещание победить врага, вы наносите ему +2к4 урона и -4 урона всем остальным, пока враг не будет побеждён."
        level: 2
        type: "пассивная"
      charge:
        name: "В Атаку!"
        description: "Когда вы ведёте отряд в бой, те, кого вы ведёте, берут +1 вперёд."
        level: 2
        type: "пассивная"
      staunch_defender:
        name: "Стойкий Защитник"
        description: "Когда вы Защищаете, вы всегда получаете +1 запас, даже при промахе."
        level: 2
        type: "пассивная"
      setup_strike:
        name: "Подготовительный Удар"
        description: "Когда вы Рубите и Режете, выберите союзника. Его следующая атака по вашей цели наносит +1к4 урона."
        level: 2
        type: "пассивная"
      holy_protection:
        name: "Святая Защита"
        description: "На миссии у вас +1 брони."
        level: 2
        type: "пассивная"
      voice_of_authority:
        name: "Голос Власти"
        description: "Берёте +1 при отдаче приказов наёмникам."
        level: 2
        type: "пассивная"
      hospitaller:
        name: "Госпитальер"
        description: "Исцеляя союзника, вы исцеляете дополнительно +1к8."
        level: 2
        type: "пассивная"
      evidence_of_faith:
        name: "Свидетельство Веры"
        description: "Требует: Божественная Благосклонность. Видя divine-магию, спросите Мастера, кто даровал заклинание и что оно делает. Берёте +1, действуя по ответам."
        level: 6
        type: "пассивная"
      holy_smite:
        name: "Святая Кара"
        description: "Заменяет Кару. На миссии вы наносите +1к8 урона."
        level: 6
        type: "пассивная"
      ever_onward:
        name: "Вперёд!"
        description: "Заменяет «В Атаку!». Ведя отряд в бой, те, кого вы ведёте, берут +1 вперёд и +2 брони вперёд."
        level: 6
        type: "пассивная"
      impervious_defender:
        name: "Несокрушимый Защитник"
        description: "Заменяет Стойкого Защитника. Всегда получайте +1 запас при Защите даже при промахе. При 12+ ближайший атакующий скован — Мастер описывает как."
        level: 6
        type: "пассивная"
      tandem_strike:
        name: "Тандемный Удар"
        description: "Заменяет Подготовительный Удар. Когда вы Рубите и Режете, союзник наносит +1к4 и берёт +1 вперёд против этой цели."
        level: 6
        type: "пассивная"
      divine_protection_pal:
        name: "Божественная Защита"
        description: "Заменяет Святую Защиту. На миссии у вас +2 брони."
        level: 6
        type: "пассивная"
      divine_authority:
        name: "Божественный Авторитет"
        description: "Заменяет Голос Власти. +1 к приказам наёмникам. При 12+ наёмник действует с особой эффективностью."
        level: 6
        type: "пассивная"
      perfect_hospitaller:
        name: "Совершенный Госпитальер"
        description: "Заменяет Госпитальера. Исцеляя союзника, вы исцеляете дополнительно +2к8."
        level: 6
        type: "пассивная"
      indomitable:
        name: "Несломленный"
        description: "Получив дебилитирующий эффект (даже через Кровавый Эгид), берёте +1 вперёд против его источника."
        level: 6
        type: "пассивная"
      perfect_knight:
        name: "Совершенный Рыцарь"
        description: "Принимая миссию, выбирайте три дара вместо двух."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ СЛЕДОПЫТА
      # =======================================================================
      hunt_and_track:
        name: "Охота и Слежка"
        description: "Следуя по следу существа, бросьте+МУД. 7+: следуйте, пока не изменится направление или способ передвижения. 10+: также задайте один вопрос о добыче или о причине окончания следа."
        level: 1
        type: "бросок:МДР"
      called_shot:
        name: "Прицельный Выстрел"
        description: "Атакуя беззащитного или застигнутого врасплох врага на расстоянии, нанесите урон или выберите цель и бросьте+ЛОВ. Голова, руки или ноги — у каждого свой эффект на 10+ и 7-9."
        level: 1
        type: "бросок:ЛОВ"
      animal_companion:
        name: "Спутник-Животное"
        description: "У вас сверхъестественная связь с верным названным животным. Выберите вид, базовые параметры, сильные стороны, навыки и слабости."
        level: 1
        type: "пассивная"
      command:
        name: "Командование"
        description: "Работая со спутником над тем, чему он обучен: добавьте его свирепость к урону, хитрость к слежке или Различению Реальности, броню к вашей броне, или инстинкт к броску помехи."
        level: 1
        type: "пассивная"
      half_elven:
        name: "Полуэльф"
        description: "Только первое продвижение. Вы получаете эльфийское умение, если взяли человеческое при создании персонажа, или наоборот."
        level: 2
        type: "пассивная"
      wild_empathy:
        name: "Звериная Эмпатия"
        description: "Вы можете говорить с животными и понимать их."
        level: 2
        type: "пассивная"
      familiar_prey:
        name: "Знакомая Добыча"
        description: "Когда вы Изрекаете Знания о чудовище, используйте МУД вместо ИНТ."
        level: 2
        type: "пассивная"
      vipers_strike:
        name: "Удар Гадюки"
        description: "Нанося удар двумя оружиями одновременно, добавьте дополнительно 1к4 за удар второй рукой."
        level: 2
        type: "пассивная"
      camouflage:
        name: "Камуфляж"
        description: "Оставаясь неподвижным в природном окружении, враги не замечают вас до тех пор, пока вы не пошевелитесь."
        level: 2
        type: "пассивная"
      mans_best_friend:
        name: "Лучший Друг Человека"
        description: "Позволив спутнику принять удар вместо вас, урон нейтрализуется, а свирепость спутника становится 0. После отдыха вместе — свирепость восстанавливается."
        level: 2
        type: "пассивная"
      blot_out_the_sun:
        name: "Закрыть Солнце"
        description: "Используя Залп, потратьте дополнительные боеприпасы перед броском. За каждый потраченный патрон выберите ещё одну цель. Бросьте один раз и примените урон ко всем."
        level: 2
        type: "пассивная"
      well_trained:
        name: "Хорошо Обученный"
        description: "Выберите ещё один навык для своего спутника-животного."
        level: 2
        type: "пассивная"
      god_amidst_the_wastes:
        name: "Бог Среди Пустошей"
        description: "Посвятите себя божеству. Получите умения Причастие и Сотворить Заклинание жреца, считая себя жрецом 1-го уровня. Увеличивайте эффективный уровень жреца с каждым уровнем."
        level: 2
        type: "пассивная"
      follow_me:
        name: "За Мной"
        description: "При Опасном Путешествии вы можете занять две роли. Делайте отдельный бросок для каждой."
        level: 2
        type: "пассивная"
      a_safe_place:
        name: "Безопасное Место"
        description: "Когда вы расставляете ночную стражу, все берут +1 к броску Несения Стражи."
        level: 2
        type: "пассивная"
      wild_speech:
        name: "Дикая Речь"
        description: "Заменяет Звериную Эмпатию. Вы можете говорить и понимать любое немагическое, непланарное существо."
        level: 6
        type: "пассивная"
      hunters_prey:
        name: "Добыча Охотника"
        description: "Заменяет Знакомую Добычу. Изрекайте Знания о чудовищах с МУД. При 12+ задайте Мастеру один дополнительный вопрос о существе."
        level: 6
        type: "пассивная"
      vipers_fangs:
        name: "Клыки Гадюки"
        description: "Заменяет Удар Гадюки. Нанося удар двумя оружиями, добавьте дополнительно 1к8 за удар второй рукой."
        level: 6
        type: "пассивная"
      smaugs_belly:
        name: "Брюхо Смауга"
        description: "Зная слабое место цели, ваши стрелы имеют 2 пробивания."
        level: 6
        type: "пассивная"
      strider:
        name: "Следопыт"
        description: "Заменяет «За Мной». При Опасном Путешествии занимайте две роли. Бросьте дважды и используйте лучший результат для обеих."
        level: 6
        type: "пассивная"
      a_safer_place:
        name: "Более Безопасное Место"
        description: "Заменяет Безопасное Место. Все берут +1 к Несению Стражи. После ночи, где вы ставили стражу, все берут +1 вперёд."
        level: 6
        type: "пассивная"
      observant:
        name: "Наблюдательный"
        description: "При успешной Охоте и Слежке вы также можете бесплатно задать один вопрос из списка Различения Реальности о выслеживаемом существе."
        level: 6
        type: "пассивная"
      special_trick:
        name: "Особый Приём"
        description: "Выберите умение другого класса. Пока вы работаете со своим спутником-животным, это умение вам доступно."
        level: 6
        type: "пассивная"
      unnatural_ally:
        name: "Неестественный Союзник"
        description: "Ваш спутник — монстр, а не животное. Опишите его. Дайте ему +2 свирепости и +1 инстинкта, а также новый навык."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ВОРА
      # =======================================================================
      trap_expert:
        name: "Эксперт по Ловушкам"
        description: "Изучая опасную область, бросьте+ЛОВ. 10+: 3 запаса. 7-9: 1. Тратьте запасы, чтобы спросить: есть ли ловушка? что её активирует? что она делает? что ещё скрыто?"
        level: 1
        type: "бросок:ЛОВ"
      tricks_of_the_trade:
        name: "Трюки Ремесла"
        description: "Вскрывая замки, обчищая карманы или обезвреживая ловушки, бросьте+ЛОВ. 10+: без проблем. 7-9: получается, но Мастер предлагает два варианта: подозрение, опасность или цена."
        level: 1
        type: "бросок:ЛОВ"
      backstab:
        name: "Удар в Спину"
        description: "Атакуя застигнутого врасплох врага оружием ближнего боя, нанесите урон или бросьте+ЛОВ. 10+: выберите два. 7-9: выберите одно — избежать рукопашной, урон+1к6, создать преимущество, или снизить броню на 1."
        level: 1
        type: "бросок:ЛОВ"
      flexible_morals:
        name: "Гибкая Мораль"
        description: "Когда кто-то пытается определить вашировнение, вы можете назвать любое."
        level: 1
        type: "пассивная"
      poisoner:
        name: "Отравитель"
        description: "Вы освоили один яд — он больше не опасен для вас. Начните с тремя дозами. Имея время и тихое место для варки, вы можете бесплатно создать ещё три дозы."
        level: 1
        type: "пассивная"
      cheap_shot:
        name: "Подлый Удар"
        description: "Используя точное или ручное оружие, ваш Удар в Спину наносит дополнительно +1к6."
        level: 2
        type: "пассивная"
      cautious:
        name: "Осторожный"
        description: "Используя Эксперта по Ловушкам, вы всегда получаете +1 запас, даже при промахе."
        level: 2
        type: "пассивная"
      wealth_and_taste:
        name: "Богатство и Вкус"
        description: "Демонстрируя самое ценное, что у вас есть, выберите присутствующего. Он сделает всё возможное, чтобы заполучить ваш предмет или похожий."
        level: 2
        type: "пассивная"
      shoot_first:
        name: "Стрелять Первым"
        description: "Вас никогда не застают врасплох. Когда враг пытается застать вас, вы действуете первым."
        level: 2
        type: "пассивная"
      poison_master:
        name: "Мастер Ядов"
        description: "Использовав яд хотя бы раз, он перестаёт быть для вас опасным."
        level: 2
        type: "пассивная"
      envenom:
        name: "Отравить"
        description: "Вы можете наносить сложные яды уколом. Когда вы наносите безопасный для вас яд на оружие, он становится контактным вместо наносимого."
        level: 2
        type: "пассивная"
      brewer:
        name: "Пивовар"
        description: "Имея время и тихое место, вы можете создать три дозы любого ранее использованного яда."
        level: 2
        type: "пассивная"
      underdog:
        name: "Слабейший"
        description: "Когда вас превосходят числом, у вас +1 брони."
        level: 2
        type: "пассивная"
      connections:
        name: "Связи"
        description: "Распустив слух о нужном вам предмете в преступном мире, бросьте+ХАР. 10+: у кого-то есть именно для вас. 7-9: придётся взять что-то похожее или с условиями."
        level: 2
        type: "бросок:ХАР"
      dirty_fighter:
        name: "Грязный Боец"
        description: "Заменяет Подлый Удар. Удар в Спину наносит +1к8, и все прочие атаки наносят +1к4."
        level: 6
        type: "пассивная"
      extremely_cautious:
        name: "Крайне Осторожный"
        description: "Заменяет Осторожного. Всегда получайте +1 запас у Эксперта по Ловушкам. При 12+: 3 запаса и Мастер сразу говорит всё о ловушке."
        level: 6
        type: "пассивная"
      alchemist:
        name: "Алхимик"
        description: "Заменяет Пивовара. Создайте три дозы любого ранее использованного яда или опишите желаемый эффект — Мастер даст его с оговорками."
        level: 6
        type: "пассивная"
      serious_underdog:
        name: "Серьёзный Слабейший"
        description: "Заменяет Слабейшего. У вас +1 брони. Когда вас превосходят числом — +2 брони."
        level: 6
        type: "пассивная"
      evasion:
        name: "Уклонение"
        description: "Когда вы Избегаете Опасности и получаете 12+, вы полностью преодолеваете угрозу. Мастер предлагает лучший исход, красоту или момент благодати."
        level: 6
        type: "пассивная"
      strong_arm_true_aim:
        name: "Твёрдая Рука, Верный Глаз"
        description: "Вы можете бросить любое оружие ближнего боя, используя его для Залпа. Брошенное оружие теряется — вы никогда не можете выбрать уменьшение боеприпасов на 7-9."
        level: 6
        type: "пассивная"
      escape_route:
        name: "Путь к Отступлению"
        description: "Когда вам нужен выход, назовите путь и бросьте+ЛОВ. 10+: вы ушли. 7-9: можете остаться или уйти, но уход стоит дорого — оставьте что-то или возьмите что-то нежелательное."
        level: 6
        type: "бросок:ЛОВ"
      disguise:
        name: "Маскировка"
        description: "Имея время и материалы, вы создаёте маскировку под любое существо схожего размера и формы. Действия могут выдать, внешность — нет."
        level: 6
        type: "пассивная"
      heist:
        name: "Ограбление"
        description: "Планируя кражу, назовите цель и спросите Мастера: кто заметит пропажу? какова главная защита? кто погонится? кто ещё хочет это? Вы и союзники берёте +1 вперёд, действуя по ответам."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ВОЛШЕБНИКА
      # =======================================================================
      spellbook:
        name: "Книга Заклинаний"
        description: "Вы освоили заклинания и записали их в книгу. Начните с трёх заклинаний 1-го уровня и всех заговоров. Добавляйте новое заклинание своего уровня или ниже при каждом повышении уровня."
        level: 1
        type: "пассивная"
      prepare_spells:
        name: "Подготовка Заклинаний"
        description: "Проведя час за изучением книги, утратьте подготовленные заклинания и подготовьте новые, чей суммарный уровень не превышает уровень+1. Заговоры подготавливаются бесплатно."
        level: 1
        type: "пассивная"
      spell_defense:
        name: "Магическая Защита"
        description: "Вы можете мгновенно завершить любое постоянное заклинание, используя его рассеивающуюся энергию для отклонения атаки. Вычтите уровень заклинания из полученного урона."
        level: 1
        type: "пассивная"
      ritual:
        name: "Ритуал"
        description: "Используя место силы для создания магического эффекта, скажите Мастеру, чего хотите достичь. Ритуальные эффекты всегда возможны, но Мастер назовёт от одного до четырёх условий."
        level: 1
        type: "пассивная"
      prodigy:
        name: "Вундеркинд"
        description: "Выберите заклинание. Вы подготавливаете его так, словно его уровень на единицу ниже."
        level: 2
        type: "пассивная"
      empowered_magic:
        name: "Усиленная Магия"
        description: "Творя заклинание и получая 10+, вы можете выбрать из списка 7-9 и также выбрать одно: максимизировать эффекты или удвоить цели."
        level: 2
        type: "пассивная"
      fount_of_knowledge:
        name: "Источник Знаний"
        description: "Изрекая Знания о том, в чём никто другой не разбирается, берёте +1."
        level: 2
        type: "пассивная"
      know_it_all:
        name: "Всезнайка"
        description: "Когда другой персонаж приходит к вам за советом и следует ему, он берёт +1 вперёд, а вы отмечаете опыт."
        level: 2
        type: "пассивная"
      expanded_spellbook:
        name: "Расширенная Книга"
        description: "Добавьте в книгу одно новое заклинание из списка любого класса."
        level: 2
        type: "пассивная"
      enchanter:
        name: "Чародей"
        description: "Имея время и безопасность рядом с магическим предметом, спросите Мастера, что он делает. Ответ будет правдивым."
        level: 2
        type: "пассивная"
      logical:
        name: "Логик"
        description: "Используя строгую дедукцию для анализа окружения, вы можете Различать Реальность с ИНТ вместо МУД."
        level: 2
        type: "пассивная"
      arcane_ward:
        name: "Магический Щит"
        description: "Пока у вас есть хотя бы одно подготовленное заклинание 1-го уровня или выше, у вас +2 брони."
        level: 2
        type: "пассивная"
      counterspell:
        name: "Контрзаклинание"
        description: "Блокируя аркановое заклинание, поставьте на кон одно подготовленное и бросьте+ИНТ. 10+: заклинание нейтрализовано. 7-9: нейтрализовано, но поставленное заклинание забыто. Защищает только вас."
        level: 2
        type: "бросок:ИНТ"
      quick_study:
        name: "Быстрое Обучение"
        description: "Видя эффекты арканового заклинания, спросите Мастера его название и эффекты. Берёте +1 вперёд, действуя по ответам."
        level: 2
        type: "пассивная"
      master:
        name: "Мастер"
        description: "Требует: Вундеркинд. Выберите ещё одно заклинание. Вы подготавливаете его как более низкого уровня."
        level: 6
        type: "пассивная"
      greater_empowered_magic:
        name: "Великая Усиленная Магия"
        description: "Заменяет Усиленную Магию. При 10-11 выберите из списка 7-9 и добавьте бонусный эффект. При 12+ получите один бонусный эффект бесплатно."
        level: 6
        type: "пассивная"
      enchanters_soul:
        name: "Душа Чародея"
        description: "Требует: Чародей. В месте силы с магическим предметом усильте его так, чтобы следующее использование было усилено. Мастер опишет как именно."
        level: 6
        type: "пассивная"
      highly_logical:
        name: "Высокий Логик"
        description: "Заменяет Логика. Различайте Реальность с ИНТ вместо МУД. При 12+ задайте Мастеру любые три вопроса, не ограничиваясь списком."
        level: 6
        type: "пассивная"
      spell_augmentation:
        name: "Усиление Заклинания"
        description: "Когда вы наносите урон заклинанием, вы можете заменить свои кости урона костями урона союзника."
        level: 6
        type: "пассивная"
      self_powered:
        name: "Самопитающийся"
        description: "При Подготовке Заклинаний вы получаете один дополнительный слот наивысшего уровня."
        level: 6
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ЯР БЕРСЕРКА
      # =======================================================================
      blood_price:
        name: "Цена Крови"
        description: "Тратя собственную кровь, вы можете взять урон до своего уровня (игнорируя броню), чтобы нанести столько же дополнительного урона следующей атакой."
        level: 1
        type: "пассивная"
      battle_rage:
        name: "Боевая Ярость"
        description: "Войдя в неистовство, бросьте+ТЕЛ. 10+: 3 запаса. 7-9: 2. Тратьте запасы, чтобы нанести +1к6 урона, игнорировать урон удара или двигаться с пугающей скоростью. В ярости вы не различаете друзей и врагов."
        level: 1
        type: "бросок:ТЕЛ"
      thick_hide:
        name: "Толстая Шкура"
        description: "Годы жизни на суровом севере закалили вас. У вас всегда +1 брони, а эффекты дебилитирующих состояний вдвое слабее."
        level: 1
        type: "пассивная"
      last_to_fall:
        name: "Последний Стоящий"
        description: "Когда вы должны сделать последний вдох, бросьте+ТЕЛ. 10+: продолжаете сражаться с 1 ОЗ. 7-9: продолжаете, но получили серьёзные травмы — Мастер называет постоянную цену."
        level: 1
        type: "бросок:ТЕЛ"

      # =======================================================================
      # УМЕНИЯ ЯР МАСТЕРА ПУТЕЙ
      # =======================================================================
      safe_passage:
        name: "Безопасный Путь"
        description: "Пока вы ведёте отряд, он не может заблудиться. Когда вы берёте роль разведчика при Опасном Путешествии, бросок всегда считается как 10+ для навигации."
        level: 1
        type: "пассивная"
      read_the_wild:
        name: "Читать Дикость"
        description: "Останавливаясь и изучая окружение, бросьте+МУД. 10+: задайте три вопроса Мастеру о угрозах, погоде или движении существ. 7-9: задайте один."
        level: 1
        type: "бросок:МДР"
      forest_step:
        name: "Лесной Шаг"
        description: "Двигаясь по дикой природе, вы не оставляете следов если не хотите. Вы движетесь в тишине без броска — если только условия не экстремальны."
        level: 1
        type: "пассивная"
      waymarker:
        name: "Метящий Путь"
        description: "Оставляя метки или схрон для союзников, они найдут дорогу без броска и смогут безопасно следовать вашим маршрутом даже без вас."
        level: 1
        type: "пассивная"

      # =======================================================================
      # УМЕНИЯ ЯР МАСТЕРА РУН
      # =======================================================================
      carve_rune:
        name: "Вырезать Руну"
        description: "Вырезая руну на поверхности, назовите условие активации. При выполнении условия руна срабатывает. Бросьте+ИНТ. 10+: 2 запаса активации. 7-9: 1."
        level: 1
        type: "бросок:ИНТ"
      runic_armor:
        name: "Руническая Броня"
        description: "Руны на вашей броне поглощают удары. Получив урон, потратьте заряд руны, чтобы снизить его на 1к6. Вы можете держать заряды рун до своего уровня."
        level: 1
        type: "пассивная"
      trigger_word:
        name: "Слово-Триггер"
        description: "Произнеся слово-триггер руны, вы активируете её немедленно, независимо от условия. Потратьте запас из Вырезать Руну."
        level: 1
        type: "пассивная"
      living_stone:
        name: "Живой Камень"
        description: "Укрепляясь через руническую волю, бросьте+ТЕЛ. 10+: урон нейтрализован. 7-9: половина урона. Руны вспыхивают и трескаются — потеряйте один заряд руны."
        level: 1
        type: "бросок:ТЕЛ"

      # =======================================================================
      # УМЕНИЯ ЯР ОХОТНИКА НА ЗЛО
      # =======================================================================
      harvest_the_slain:
        name: "Собрать с Павших"
        description: "Уделив время сбору трофеев после победы, бросьте+МУД. 10+: соберите 3 полезных компонента. 7-9: 1. Мастер описывает, что вы нашли и как это можно использовать."
        level: 1
        type: "бросок:МДР"
      brew_hunter_oil:
        name: "Варить Охотничье Масло"
        description: "Тратя компоненты и травы для варки масла, назовите тип существа-мишени. Нанесённое на оружие перед боем, оно даёт +1к6 урона против существ этого типа до конца схватки."
        level: 1
        type: "пассивная"
      study_the_prey:
        name: "Изучить Добычу"
        description: "Наблюдая за существом без вступления в бой, бросьте+МУД. 10+: узнайте его слабость, броню и одно особое умение. 7-9: узнайте одно из трёх."
        level: 1
        type: "бросок:МДР"
      prepared_mind:
        name: "Подготовленный Разум"
        description: "Вас не могут застать врасплох существа любого типа, на который вы охотились ранее. Сражаясь с изученным типом, берёте +1 вперёд на первый бросок боя."
        level: 1
        type: "пассивная"

    # =========================================================================
    # СНАРЯЖЕНИЕ
    # =========================================================================
    # Броня
    obj:
      leather_armor:
        name: "Кожаная Броня"
        description: "Выделанные шкуры, сформированные в защитное облачение. [worn, armor_1](-){1}"
      chainmail:
        name: "Кольчуга"
        description: "Переплетённые металлические кольца. Тяжёлая, но надёжная. [worn, armor_1, clumsy](-){1}"
      scale_armor:
        name: "Чешуйчатая Броня"
        description: "Перекрывающиеся металлические пластины на кожаной основе. [worn, armor_2, clumsy](-){3}"
      hide_armor:
        name: "Броня из Шкур"
        description: "Грубо выделанные звериные шкуры. Примитивно, но функционально в глуши. [worn, armor_1](-){1}"
      shield:
        name: "Щит"
        description: "Прочный щит из дерева и железа. [held, armor_1](-){2}"
      wooden_shield:
        name: "Деревянный Щит"
        description: "Лёгкий деревянный щит, быстро поднимается и легко переносится. [held, armor_1](-){1}"
      # Оружие ближнего боя
      dueling_rapier:
        name: "Дуэльная Рапира"
        description: "Тонкий клинок, любимый артистами и дуэлянтами. [close, precise](-){2}"
      short_sword:
        name: "Короткий Меч"
        description: "Надёжный клинок, лёгкий и быстрый. [close](-){1}"
      longsword:
        name: "Длинный Меч"
        description: "Сбалансированный меч с хорошей досягаемостью и силой. [close, +1 damage](-){1}"
      warhammer:
        name: "Боевой Молот"
        description: "Тяжёлый молот, сделанный для крушения брони и костей. [close](-){1}"
      mace:
        name: "Булава"
        description: "Железный фланец на деревянной рукоятке. Просто и жестоко. [close](-){1}"
      staff:
        name: "Посох"
        description: "Длинный деревянный шест, сбалансированный для удара и ходьбы. [close, two_handed](-){1}"
      shillelagh:
        name: "Шиллела"
        description: "Крепкая дубовая дубина, просушенная и утяжелённая. [close](-){2}"
      spear:
        name: "Копьё"
        description: "Длинное древко с железным наконечником, хорошо для тычков и метания. [close, thrown, near](-){1}"
      halberd:
        name: "Алебарда"
        description: "Топорное лезвие и копейный наконечник на длинном древке. Устрашающая досягаемость. [reach, two_handed, +1 damage](-){2}"
      dagger:
        name: "Кинжал"
        description: "Короткий клинок для ближнего боя. Всюду помещается, везде полезен. [hand](-){1}"
      hunting_knife:
        name: "Охотничий Нож"
        description: "Крепкий клинок на поясе. Инструмент и оружие одновременно. [hand](-){1}"
      great_axe:
        name: "Большой Топор"
        description: "Огромный двуручный топор, разрубающий броню и людей одинаково. [reach, two_handed, messy](-){2}"
      runic_warhammer:
        name: "Рунический Боевой Молот"
        description: "Боевой молот с вырезанными рунами, гудящий скрытой силой. [close](-){1}"
      signature_weapon:
        name: "Фирменное Оружие"
        description: "Ваше оружие. Выберите базу, дальность, два улучшения и внешний вид. [signature](-){2}"
      # Дальнобойное оружие
      hunters_bow:
        name: "Охотничий Лук"
        description: "Хорошо сделанный лук, подходящий для поля и охоты. [near, far](-){1}"
      worn_bow:
        name: "Потрёпанный Лук"
        description: "Рабочий лук, несущий следы долгого использования. [near](-){2}"
      ragged_bow:
        name: "Ветхий Лук"
        description: "Грубый лук, едва держащийся, но стреляющий достаточно точно. [near](-){2}"
      arrows:
        name: "Связка Стрел"
        description: "Пучок оперённых стрел, достаточно для схватки. [ammo](3){1}"
      throwing_daggers:
        name: "Метательные Кинжалы"
        description: "Сбалансированные клинки, предназначенные для точного метания. [thrown, near](3){0}"
      # Расходники
      dungeon_rations:
        name: "Дорожные Пайки"
        description: "Галеты, вяленое мясо и всё, что выживает в дороге. [consumed](5){1}"
      dungeon_rations_extra:
        name: "Дорожные Пайки"
        description: "Галеты, вяленое мясо и всё, что выживает в дороге. [consumed](5){1}"
      healing_potion:
        name: "Целебное Зелье"
        description: "Маленький флакон восстановительной жидкости. Выпив, восстанавливает 10 ОЗ. [consumed](1){0}"
      antitoxin:
        name: "Антитоксин"
        description: "Нейтрализует один яд или токсин при употреблении. [consumed](1){0}"
      bandages:
        name: "Бинты"
        description: "Полосы чистой ткани для перевязки ран в полевых условиях. [consumed](3){0}"
      poultices_and_herbs:
        name: "Припарки и Травы"
        description: "Приготовленные средства от ран и недугов. [consumed](2){1}"
      herbs_and_poultices:
        name: "Травы и Припарки"
        description: "Собранные лекарственные растения и приготовленные средства — полевой набор охотника. [consumed](3){1}"
      halfling_pipeleaf:
        name: "Трубочный Лист Халфлингов"
        description: "Ароматный лист для трубки. Успокаивает. Располагает к общению. [consumed](-){0}"
      monster_components:
        name: "Компоненты Монстров"
        description: "Собранные части поверженных существ — когти, желчь, железы. Полезны для варки. [consumed, crafting](2){1}"
      # Яды
      poison_oil_of_tagit:
        name: "Масло Тагита"
        description: "Нанесённое осторожно, погружает цель в лёгкий сон. [poison, applied](1){0}"
      poison_bloodweed:
        name: "Кровяная Трава"
        description: "Контактный яд. Цель получает -1к4 урона постоянно до исцеления. [poison, touch](1){0}"
      poison_goldenroot:
        name: "Золотой Корень"
        description: "Наносимый яд. Цель считает следующее увиденное существо доверенным союзником, пока не будет доказано обратное. [poison, applied](1){0}"
      poison_serpents_tears:
        name: "Слёзы Змеи"
        description: "Контактный яд. Все, кто наносит урон цели, бросают дважды и берут лучший результат. [poison, touch](1){0}"
      poison_chosen:
        name: "Выбранный Яд"
        description: "Ваш освоенный яд — замените этот ключ конкретным ядом, выбранным при создании. [poison](3){0}"
      # Снаряжение и инструменты
      adventuring_gear:
        name: "Снаряжение Авантюриста"
        description: "Верёвка, факелы, мел, крюки и прочие инструменты ремесла. [gear](-){1}"
      spellbook:
        name: "Книга Заклинаний"
        description: "Кожаный том заклинаний и арканных заметок. Незаменим. [gear, fragile](-){1}"
      bag_of_books:
        name: "Сумка с Книгами"
        description: "Сумка с справочными текстами, полезными для исследований в поле. [gear](5){2}"
      holy_symbol:
        name: "Святой Символ"
        description: "Священный образ вашего бога, носимый или хранимый как фокус для божественной силы. [gear, divine](-){0}"
      mark_of_faith:
        name: "Знак Веры"
        description: "Символ, клеймо или знак, обозначающий вас инструментом вашего бога. [gear, divine](-){0}"
      land_token:
        name: "Знак Земли"
        description: "Небольшой предмет из вашей родной земли — камень, семя, сухой цветок. Опишите его. [gear](-){0}"
      rune_chisels:
        name: "Рунические Резцы"
        description: "Тонкие железные инструменты для точной гравировки рун на камне, дереве или металле. [gear, tools](-){0}"
      rope:
        name: "Верёвка"
        description: "Прочная пеньковая верёвка, 15 метров. Полезна для лазания, связывания и обозначения путей. [gear](-){1}"
      ostentatious_clothes:
        name: "Вычурная Одежда"
        description: "Наряд, объявляющий о вашем прибытии раньше вас. [worn](-){0}"
    # =========================================================================
    # ЗАКЛИНАНИЯ
    # =========================================================================
    spell:
      # =======================================================================
      # ЗАКЛИНАНИЯ ЖРЕЦА
      # =======================================================================
      priest:
        # Молитвы (уровень 0 — всегда подготовлены, не входят в лимит)
        light:
          name: "Свет"
          level: 0
          tags: []
          description: "Предмет, которого вы касаетесь, начинает светиться божественным светом — примерно как факел. Он не даёт тепла и звука, не требует топлива, но во всём остальном подобен обычному факелу. Вы полностью контролируете цвет пламени. Заклинание действует, пока предмет находится рядом с вами."

        sanctify:
          name: "Освящение"
          level: 0
          tags: []
          description: "Еда или вода, которую вы держите в руках во время чтения этого заклинания, освящается вашим богом. Помимо обретения священного или нечестивого характера, вещество очищается от любой обычной порчи."

        guidance:
          name: "Наставление"
          level: 0
          tags: []
          description: "Символ вашего бога появляется перед вами и указывает направление или образ действий, которых от вас ожидает божество, а затем исчезает. Послание передаётся только жестом — словесного общения через это заклинание нет."

        # Уровень 1
        bless:
          name: "Благословение"
          level: 1
          tags: ["ongoing"]
          description: "Ваш бог улыбается выбранному вами бойцу. Пока длится битва и тот стоит и сражается, он получает +1 к продолжительным броскам. Пока это заклинание активно, вы получаете -1 к сотворению заклинаний."

        cure_light_wounds:
          name: "Лечение лёгких ран"
          level: 1
          tags: []
          description: "От вашего прикосновения раны затягиваются, а кости перестают болеть. Исцелите союзника, которого касаетесь, на 1d8 урона."

        detect_alignment:
          name: "Определение мировоззрения"
          level: 1
          tags: []
          description: "При сотворении этого заклинания выберите мировоззрение: Доброе, Злое, Законное или Хаотичное. Одно из ваших чувств на короткое время улавливает это мировоззрение. Мастер расскажет, что здесь несёт в себе выбранное мировоззрение."

        cause_fear:
          name: "Страх"
          level: 1
          tags: ["ongoing"]
          description: "Выберите видимую вами цель и находящийся рядом предмет. Пока вы поддерживаете заклинание, цель боится этого предмета. Её реакция — на усмотрение игрока: бегство, паника, мольбы, бой. Пока заклинание активно, вы получаете -1 к сотворению заклинаний. Нельзя выбирать целью существ с разумом ниже животного (магические конструкты, нежить, автоматоны и подобное)."

        magic_weapon:
          name: "Магическое оружие"
          level: 1
          tags: ["ongoing"]
          description: "Оружие, которое вы держите при сотворении, наносит +1d4 урона, пока вы не развеете заклинание. Пока оно активно, вы получаете -1 к сотворению заклинаний."

        sanctuary:
          name: "Святилище"
          level: 1
          tags: []
          description: "Читая это заклинание, вы обходите периметр области, посвящая её своему богу. Пока вы остаётесь внутри, вы получаете предупреждение всякий раз, когда кто-то совершает злой умысел в пределах святилища (включая вход с враждебными намерениями). Каждый, кто получает исцеление внутри святилища, восстанавливает дополнительно +1d4 ОЗ."

        speak_with_dead:
          name: "Разговор с мёртвыми"
          level: 1
          tags: []
          description: "Труп ненадолго вступает с вами в беседу. Он ответит на любые три вопроса, которые вы зададите, исходя из знаний, которыми обладал при жизни, и того, что узнал после смерти."

        # Уровень 3
        animate_dead:
          name: "Оживление мертвецов"
          level: 3
          tags: ["ongoing"]
          description: "Вы призываете голодный дух, чтобы тот вселился в недавно умершее тело и служил вам. Это создаёт зомби, который выполняет ваши приказы в меру своих ограниченных возможностей. Считайте зомби персонажем, но с доступом только к базовым ходам. У него модификатор +1 ко всем характеристикам и 1 ОЗ. Зомби также получает на ваш выбор 1d4 черты: он талантлив (+2 к одной характеристике), он живуч (+2 ОЗ за каждый ваш уровень), у него есть работающий мозг и он способен выполнять сложные задачи, он не выглядит явно мёртвым — по крайней мере день-два. Зомби существует, пока его не уничтожат, или пока вы не завершите заклинание. Пока оно активно, вы получаете -1 к сотворению заклинаний."

        cure_moderate_wounds:
          name: "Лечение умеренных ран"
          level: 3
          tags: []
          description: "Вы останавливаете кровотечение и вправляете кости магией. Исцелите союзника, которого касаетесь, на 2d8 урона."

        darkness:
          name: "Тьма"
          level: 3
          tags: ["ongoing"]
          description: "Выберите видимую вами область: она наполняется сверхъестественной темнотой и тенью. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        resurrection:
          name: "Воскрешение"
          level: 3
          tags: []
          description: "Скажите Мастеру, что хотите воскресить труп, чья душа ещё не полностью покинула этот мир. Воскрешение всегда возможно, но Мастер назовёт одно или несколько условий: это займёт дни/недели/месяцы; вы должны заручиться помощью кого-то; потребуется много денег; придётся чем-то пожертвовать."

        hold_person:
          name: "Оковы"
          level: 3
          tags: []
          description: "Выберите видимого вами человека. Пока вы не сотворите другое заклинание или не покинете его присутствие, цель не может действовать, лишь говорить. Эффект мгновенно заканчивается, если цель получает урон из любого источника."

        # Уровень 5
        revelation:
          name: "Откровение"
          level: 5
          tags: []
          description: "Ваш бог отвечает на молитвы мгновением совершенного понимания. Мастер прольёт свет на текущую ситуацию. Действуя на основе полученной информации, вы получаете +1 вперёд."

        cure_critical_wounds:
          name: "Лечение тяжёлых ран"
          level: 5
          tags: []
          description: "Исцелите союзника, которого касаетесь, на 3d8 урона."

        divination:
          name: "Прорицание"
          level: 5
          tags: []
          description: "Назовите человека, место или предмет, о котором хотите узнать. Ваш бог дарует вам видения цели — столь же ясные, как если бы вы были там."

        contagion:
          name: "Заражение"
          level: 5
          tags: ["ongoing"]
          description: "Выберите видимое вами существо. Пока вы не завершите заклинание, цель страдает от болезни на ваш выбор. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        words_of_the_unspeaking:
          name: "Слова безмолвных"
          level: 5
          tags: []
          description: "Прикосновением вы говорите с духами внутри предметов. Неживой объект, которого вы касаетесь, отвечает на три заданных вами вопроса настолько точно, насколько может."

        true_seeing:
          name: "Истинное зрение"
          level: 5
          tags: ["ongoing"]
          description: "Ваш взор открывается к истинной природе всего, на что вы смотрите. Вы пронизываете иллюзии и видите скрытое. Мастер описывает область перед вами, игнорируя любые иллюзии и ложь — магические или нет. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        trap_soul:
          name: "Ловушка для души"
          level: 5
          tags: []
          description: "Вы заключаете душу умирающего существа в самоцвет. Пленённое существо осознаёт своё заточение, но им всё ещё можно манипулировать через заклинания, переговоры и другие эффекты. Все ходы против пленённого существа совершаются с +1. Вы можете освободить душу в любой момент, но захватить её повторно уже нельзя."

        # Уровень 7
        word_of_recall:
          name: "Слово возврата"
          level: 7
          tags: []
          description: "Выберите слово. Первый раз после сотворения этого заклинания, когда вы произнесёте выбранное слово, вы и все союзники, касавшиеся вас во время сотворения, немедленно переместитесь точно на то место, где вы читали заклинание. Можно поддерживать только одно место; повторное сотворение до произнесения слова заменяет прежнее."

        heal:
          name: "Исцеление"
          level: 7
          tags: []
          description: "Коснитесь союзника — вы можете восстановить ему урон на количество очков, не превышающее ваш максимум ОЗ."

        harm:
          name: "Вред"
          level: 7
          tags: []
          description: "Коснитесь врага и поразите его божественным гневом — нанесите ему 2d8 урона и 1d6 урона себе. Этот урон игнорирует броню."

        sever:
          name: "Отсечение"
          level: 7
          tags: ["ongoing"]
          description: "Выберите конечность цели: руку, щупальце, крыло. Конечность магически отделяется от тела, не нанося урона, но причиняя значительную боль. Утрата конечности может, например, лишить крылатое существо способности летать или быка — бодать рогами. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        mark_of_death:
          name: "Метка смерти"
          level: 7
          tags: []
          description: "Выберите существо, чьё истинное имя вам известно. Это заклинание создаёт постоянные руны на выбранной поверхности, которые убьют это существо, если оно их прочитает."

        control_weather:
          name: "Управление погодой"
          level: 7
          tags: []
          description: "Помолитесь о дожде — или солнце, ветре, снеге. В течение дня или около того ваш бог ответит. Погода изменится по вашей воле и продержится несколько дней."

        # Уровень 9
        storm_of_vengeance:
          name: "Шторм возмездия"
          level: 9
          tags: []
          description: "Ваш бог насылает на мир неестественную погоду на ваш выбор. Дождь из крови или кислоты, тучи из душ, ветер, сносящий здания, или любая другая погода, какую вы только можете представить: попросите — и оно придёт."

        repair:
          name: "Восстановление"
          level: 9
          tags: []
          description: "Выберите одно событие в прошлом цели. Все последствия этого события — урон, яд, болезнь, магические эффекты — прекращаются и устраняются. ОЗ и болезни исцеляются, яды нейтрализуются, магические эффекты заканчиваются."

        divine_presence:
          name: "Божественное присутствие"
          level: 9
          tags: ["ongoing"]
          description: "Каждое существо должно просить у вас позволения войти в ваше присутствие, и вы должны вслух дать разрешение. Любое существо без вашего позволения получает дополнительно 1d10 урона всякий раз, когда получает урон рядом с вами. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        consume_unlife:
          name: "Поглощение нежити"
          level: 9
          tags: []
          description: "Бессознательная нежить, которой вы касаетесь, уничтожается, а вы похищаете её смертную энергию, чтобы исцелить себя или следующего союзника, которого коснётесь. Количество восстанавливаемого урона равно ОЗ, которые оставались у существа до уничтожения."

        plague:
          name: "Мор"
          level: 9
          tags: ["ongoing"]
          description: "Назовите город, деревню, лагерь или иное населённое место. Пока заклинание активно, это место охвачено мором, подходящим для владений вашего бога. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

      # =======================================================================
      # ЗАКЛИНАНИЯ МАГА
      # =======================================================================
      wizard:
        # Кантрипы (уровень 0 — всегда подготовлены, не входят в лимит)
        light:
          name: "Свет"
          level: 0
          tags: []
          description: "Предмет, которого вы касаетесь, начинает светиться магическим светом — примерно как факел. Он не даёт тепла и звука, не требует топлива, но во всём остальном подобен обычному факелу. Вы полностью контролируете цвет пламени. Заклинание действует, пока предмет находится рядом с вами."

        unseen_servant:
          name: "Незримый слуга"
          level: 0
          tags: ["ongoing"]
          description: "Вы вызываете простой невидимый конструкт, способный только переносить предметы. У него Нагрузка 3, он несёт всё, что вы ему передаёте. Он не может самостоятельно подбирать предметы и несёт лишь то, что вы ему вручили. Предметы в руках незримого слуги как будто парят в воздухе в нескольких шагах позади вас. Слуга, получивший урон или покинувший ваше присутствие, немедленно рассеивается, роняя всё, что нёс. В остальном он служит вам, пока вы не завершите заклинание."

        prestidigitation:
          name: "Фокус"
          level: 0
          tags: []
          description: "Вы исполняете незначительные трюки настоящей магии. Если при сотворении вы касаетесь предмета, можете внести в него косметические изменения: очистить, испачкать, охладить, нагреть, изменить вкус или цвет. Если касания нет — создайте небольшие иллюзии не крупнее себя. Иллюзии фокуса грубы и явно ненастоящие — никого не обманут, но могут развлечь."

        # Уровень 1
        contact_spirits:
          name: "Связь с духами"
          level: 1
          tags: ["summoning"]
          description: "Назовите духа, с которым хотите связаться (или предоставьте выбор Мастеру). Вы притягиваете это существо сквозь планы — ровно настолько, чтобы говорить с вами. Оно обязано ответить на один любой ваш вопрос настолько точно, насколько может."

        detect_magic:
          name: "Обнаружение магии"
          level: 1
          tags: ["divination"]
          description: "Одно из ваших чувств на короткое время настраивается на магию. Мастер расскажет, что здесь является магическим."

        telepathy:
          name: "Телепатия"
          level: 1
          tags: ["divination", "ongoing"]
          description: "Вы устанавливаете телепатическую связь с одним человеком, которого касаетесь, позволяя общаться через мысли. Одновременно может быть только одна телепатическая связь."

        charm_person:
          name: "Очарование личности"
          level: 1
          tags: ["enchantment", "ongoing"]
          description: "Человек (не зверь и не монстр), которого вы касаетесь при сотворении, считает вас другом, пока не получит урон или пока вы не докажете обратного."

        invisibility:
          name: "Невидимость"
          level: 1
          tags: ["illusion", "ongoing"]
          description: "Коснитесь союзника — никто его не видит. Он невидим! Заклинание действует, пока цель не атакует или вы не развеете эффект. Пока заклинание активно, вы не можете сотворять заклинания."

        magic_missile:
          name: "Магическая стрела"
          level: 1
          tags: ["evocation"]
          description: "С ваших пальцев срываются снаряды чистой магии. Нанесите 2d4 урона одной цели."

        alarm:
          name: "Сигнализация"
          level: 1
          tags: []
          description: "Читая это заклинание, обойдите широкий круг. Пока вы снова не подготовите заклинания, магия предупредит вас, если существо пересечёт этот круг. Даже если вы спите, заклинание разбудит вас."

        # Уровень 3
        dispel_magic:
          name: "Рассеивание магии"
          level: 3
          tags: []
          description: "Выберите заклинание или магический эффект в вашем присутствии: это заклинание разрывает его. Слабые заклинания прекращаются, мощная магия лишь ослабляется или приглушается, пока вы находитесь рядом."

        visions_through_time:
          name: "Видения сквозь время"
          level: 3
          tags: ["divination"]
          description: "Сотворив это заклинание, вглядитесь в отражающую поверхность, чтобы увидеть глубины времени. Мастер откроет вам детали мрачного предзнаменования — тёмного события, которое случится без вашего вмешательства. Он также подскажет кое-что полезное о том, как помешать этому исходу."

        fireball:
          name: "Огненный шар"
          level: 3
          tags: ["evocation"]
          description: "Вы вызываете мощный огненный шар, охватывающий цель и всех, кто рядом, нанося 2d6 урона, игнорирующего броню."

        mimic:
          name: "Подражание"
          level: 3
          tags: ["ongoing"]
          description: "Вы принимаете облик того, кого коснулись при сотворении. Ваши физические характеристики точно совпадают с их характеристиками, но поведение — не обязательно. Изменение сохраняется, пока вы не получите урон или не решите вернуться к своему облику. Пока заклинание активно, вы теряете доступ ко всем ходам мага."

        mirror_image:
          name: "Зеркальный двойник"
          level: 3
          tags: ["illusion"]
          description: "Вы создаёте иллюзорный образ себя. Когда вас атакуют, бросьте d6. При результате 4, 5 или 6 атака попадает в иллюзию, та рассеивается и заклинание заканчивается."

        sleep:
          name: "Сон"
          level: 3
          tags: ["enchantment"]
          description: "1d4 видимых вами врагов на выбор Мастера засыпают. Эффект действует только на существ, способных спать. Они просыпаются как обычно: от громких звуков, толчков, боли."

        # Уровень 5
        cage:
          name: "Клетка"
          level: 5
          tags: ["evocation", "ongoing"]
          description: "Цель удерживается в клетке из магической силы. Ничто не может войти или выйти из клетки. Она остаётся, пока вы не сотворите другое заклинание или не развеете её. Пока заклинание активно, заключённое существо слышит ваши мысли, а вы не можете покидать поле зрения клетки."

        contact_other_plane:
          name: "Связь с иным планом"
          level: 5
          tags: ["divination"]
          description: "Вы отправляете запрос на другой план. Укажите, с кем или чем хотите связаться: местоположение, тип существа, имя или титул. Вы открываете двустороннее общение с этим существом. Связь может быть прервана в любое время — вами или существом."

        polymorph:
          name: "Превращение"
          level: 5
          tags: ["enchantment"]
          description: "Ваше прикосновение полностью меняет форму существа — оно остаётся в созданном вами облике, пока вы не сотворите другое заклинание. Опишите новую форму, включая изменения характеристик, ключевые адаптации или уязвимости. Мастер назовёт одно или несколько из следующего: форма нестабильна и временна; разум существа тоже изменится; у формы есть непредвиденное преимущество или слабость."

        summon_monster:
          name: "Призыв монстра"
          level: 5
          tags: ["summoning", "ongoing"]
          description: "Появляется монстр и помогает вам настолько, насколько может. Считайте его персонажем, но с доступом только к базовым ходам. У него модификатор +1 ко всем характеристикам, 1 ОЗ и кубик урона как у вас. Монстр также получает на ваш выбор 1d6 черт: +2 вместо +1 к одной характеристике; он не безрассуден; наносит 1d8 урона; его связь с вашим планом крепка (+2 ОЗ за каждый ваш уровень); у него есть полезная адаптация. Мастер скажет, какой тип монстра вы получаете, исходя из выбранных черт. Существо остаётся на этом плане, пока не погибнет или вы не отпустите его. Пока заклинание активно, вы получаете -1 к сотворению заклинаний."

        # Уровень 7
        dominate:
          name: "Подчинение"
          level: 7
          tags: ["enchantment", "ongoing"]
          description: "Ваше прикосновение вталкивает ваш разум в чужой. Вы получаете 1d4 запаса. Потратьте 1 запас, чтобы цель произнесла несколько слов на ваш выбор, отдала вам то, что держит, совершила целенаправленную атаку на выбранную вами цель или правдиво ответила на один вопрос. Если запас заканчивается — заклинание прекращается. Если цель получает урон, вы теряете 1 запас. Пока заклинание активно, вы не можете сотворять заклинания."

        true_seeing:
          name: "Истинное зрение"
          level: 7
          tags: ["divination", "ongoing"]
          description: "Вы видите все вещи такими, какие они есть на самом деле. Этот эффект сохраняется, пока вы не солжёте или не развеете заклинание. Пока оно активно, вы получаете -1 к сотворению заклинаний."

        shadow_walk:
          name: "Шаг сквозь тени"
          level: 7
          tags: ["illusion"]
          description: "Тени, на которые направлено это заклинание, становятся порталом для вас и ваших союзников. Назовите место, описав его количеством слов, не превышающим ваш уровень. Пройдя через портал, вы и все союзники, присутствовавшие при сотворении, окажетесь в названном месте. Каждый союзник может воспользоваться порталом лишь однажды."

        contingency:
          name: "Отложенное заклинание"
          level: 7
          tags: ["evocation"]
          description: "Выберите известное вам заклинание 5-го уровня или ниже. Опишите условие срабатывания количеством слов, равным вашему уровню. Выбранное заклинание удерживается, пока вы не решите его применить или пока условие не будет выполнено — в зависимости от того, что наступит раньше. Бросать кубики за удержанное заклинание не нужно — оно просто срабатывает. Одновременно можно удерживать только одно заклинание; новое заменяет предыдущее."

        cloudkill:
          name: "Облако смерти"
          level: 7
          tags: ["summoning", "ongoing"]
          description: "Облако тумана из-за Чёрных врат смерти заполняет ближайшую область. Каждый раз, когда существо в этой области получает урон, оно дополнительно получает 1d6 урона, игнорирующего броню. Заклинание действует, пока вы видите поражённую область, или пока вы не развеете его."

        # Уровень 9
        antipathy:
          name: "Антипатия"
          level: 9
          tags: ["enchantment", "ongoing"]
          description: "Выберите цель и опишите тип существ или мировоззрение. Существа указанного типа или мировоззрения не могут оказаться в поле зрения цели. Если такое существо всё же видит цель — оно немедленно бежит. Эффект продолжается, пока вы не покинете присутствие цели или не развеете заклинание. Пока оно активно, вы получаете -1 к сотворению заклинаний."

        alert:
          name: "Оповещение"
          level: 9
          tags: ["divination"]
          description: "Опишите событие. Мастер сообщит вам, когда оно произойдёт — где бы вы ни находились и на каком бы расстоянии ни были. По желанию вы можете наблюдать за местом события, словно присутствуете там лично. Одновременно может быть активно только одно Оповещение."

        soul_gem:
          name: "Камень души"
          level: 9
          tags: []
          description: "Вы заключаете душу умирающего существа в самоцвет. Пленённое существо осознаёт своё заточение, но им всё ещё можно манипулировать через заклинания, переговоры и другие эффекты. Все ходы против пленённого существа совершаются с +1. Вы можете освободить душу в любой момент, но захватить её повторно уже нельзя."

        shelter:
          name: "Убежище"
          level: 9
          tags: ["evocation", "ongoing"]
          description: "Вы создаёте строение из чистой магической силы. Оно может быть размером с замок или с хижину, но неуязвимо для любого немагического урона. Строение существует, пока вы не покинете его или не завершите заклинание."

        perfect_summons:
          name: "Совершенный призыв"
          level: 9
          tags: ["summoning"]
          description: "Вы телепортируете существо к себе. Назовите конкретное существо или дайте краткое описание типа существа. Если названо конкретное — оно появится перед вами. Если описан тип — перед вами появится существо этого типа."